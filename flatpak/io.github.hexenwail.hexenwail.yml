app-id: io.github.hexenwail.hexenwail
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hexenwail.sh

finish-args:
  # GPU (OpenGL 4.3)
  - --device=dri
  # Display (Wayland preferred, X11 fallback)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Gamepads/joysticks (--device=input was removed in Freedesktop 25.08;
  # --device=all is the de-facto Flathub convention for games needing
  # controller access via /dev/input/event*).
  - --device=all
  # Audio (PulseAudio/PipeWire)
  - --socket=pulseaudio
  # Network (LAN multiplayer)
  - --share=network
  # Game data — user places pak files here
  - --persist=.hexen2

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # SDL3 is bundled in org.freedesktop.Platform 25.08 — no module needed

  - name: fluidsynth
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # Pin the libdir, or nothing here is ever linked.  FluidSynth's
      # DefaultDirs.cmake is a bare include(GNUInstallDirs), and GNUInstallDirs
      # defaults CMAKE_INSTALL_LIBDIR to lib64 on 64-bit Linux.  Its exceptions
      # never covered us either way: the Debian-multiarch one needs
      # /etc/debian_version and an /usr prefix, and CMake 4.x dropped the
      # distro exceptions entirely, leaving only a conda check.
      # fluidsynth.pc then installs to /app/lib64/pkgconfig, which is not on
      # flatpak's PKG_CONFIG_PATH, so pkg_check_modules(FLUIDSYNTH fluidsynth)
      # misses it, engine/CMakeLists.txt quietly takes its else arm, and the
      # build ships midi_nul.c + libTiMidity with every option below inert.
      # That is uhexen2-rp1z, and it is why opusfile and libxmp resolved fine
      # while this module did not: both are autotools and land in /app/lib.
      #
      # This replaces -DLIB_SUFFIX=, which was doing nothing whatsoever:
      # LIB_SUFFIX does not appear anywhere in FluidSynth 2.4.6's build system
      # (checked against the v2.4.6 tree; the only hit in the repo is a stale
      # line in their own Android CI yml).  It was removed upstream, so the
      # option this manifest was using to control the libdir had no effect.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -Denable-libsndfile=off
      - -Denable-dbus=off
      - -Denable-systemd=off
      # No audio driver backends: since uhexen2-tdss the engine renders MIDI
      # itself with fluid_synth_write_s16 and feeds the result to the engine's
      # own SDL mixer, so it never calls new_fluid_audio_driver.  Every backend
      # below is therefore dead code in this build, and leaving them enabled
      # links extra libraries into the sandbox for a driver that is never
      # created — the same driver stack that failed inside the sandbox and
      # caused uhexen2-tdss in the first place.  uhexen2-hfd6.
      - -Denable-jack=off
      - -Denable-pulseaudio=off
      - -Denable-alsa=off
      - -Denable-oss=off
      - -Denable-pipewire=off
      - -Denable-portaudio=off
      - -Denable-sdl2=off
      # sdl3 especially: org.freedesktop.Platform 25.08 bundles SDL3, so this
      # backend would otherwise be detected and built even though the engine
      # drives the synth itself.
      - -Denable-sdl3=off
    sources:
      - type: git
        url: https://github.com/FluidSynth/fluidsynth.git
        tag: v2.4.6
        disable-submodules: true

  # opusfile only.  libogg, libvorbis and libopus used to be built here too
  # and are not any more: org.freedesktop.Platform 25.08 already ships all
  # three (they are in freedesktop-sdk's platform.bst, the stack of elements
  # in the runtime), so building them put a second frozen copy of each into
  # /app where it shadowed the runtime's.  Same reasoning that already
  # removed the SDL3 module.  The runtime's copies also keep getting security
  # updates from freedesktop-sdk, which a version pinned in this file never
  # would.  opusfile stays because it is genuinely absent from the runtime,
  # as are fluidsynth and libxmp.  uhexen2-bvei.
  #
  # xiph.org's CDN has been intermittently unreachable from GitHub Actions
  # runners, so the GitHub release mirror is primary with xiph.org as
  # fallback.  The tarballs are identical (sha256 matches both).

  - name: opusfile
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/xiph/opusfile/releases/download/v0.12/opusfile-0.12.tar.gz
        mirror-urls:
          - https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz
        sha256: 118d8601c12dd6a44f52423e68ca9083cc9f2bfe72da7a8c1acb22a80ae3550b

  - name: libxmp
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/libxmp/libxmp.git
        tag: libxmp-4.6.3
        commit: bed660f8e530d399c38f27a5a7732f4e79740585

  # General MIDI soundfont for FluidSynth.  Without a soundfont FluidSynth
  # fails to initialise, no MIDI driver registers, and every MIDI track
  # reports "Couldn't handle music file <name>" -- there is no MID streamer
  # codec, so midi/<name>.mid can only play through FluidSynth.  Bare systems
  # (Steam Deck, fresh installs) ship no system soundfont, so we bundle one.
  # TimGM6mb (Tim Brechbill, GPL-2) is ~6 MB.  Installed as default.sf2, which
  # find_soundfont() in midi_fluid.c probes first under /app/share/soundfonts.
  - name: timgm6mb-soundfont
    buildsystem: simple
    build-commands:
      - install -Dm644 TimGM6mb.sf2 /app/share/soundfonts/default.sf2
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/t/timgm6mb-soundfont/timgm6mb-soundfont_1.3.orig.tar.gz
        sha256: af8f3a00e416dfb262bcaa904a1c84df04a51b72bbc1313aed012bc754bdf99b

  - name: hexenwail
    buildsystem: cmake-ninja
    subdir: engine
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_CODEC_VORBIS=ON
      - -DUSE_CODEC_OPUS=ON
      - -DUSE_CODEC_XMP=ON
      - -DUSE_ALSA=OFF
      - -DSOUNDFONT_PATH=/app/share/soundfonts/default.sf2
    sources:
      - type: dir
        path: ..
    post-install:
      # engine/CMakeLists.txt answers a missing codec with `message(STATUS
      # ...)` and `set(USE_CODEC_x OFF)` -- it does not fail.  So if the
      # runtime ever stops shipping vorbis or ogg, or a pkg-config file moves,
      # this manifest would build green and produce an engine with no Ogg
      # music and no way to notice.  Now that we depend on the runtime for
      # those rather than building our own, assert the binary really did link
      # them.  Plain grep rather than readelf: SONAMEs live in .dynstr, so a
      # binary grep finds them, and binutils is not an explicit component of
      # org.freedesktop.Sdk.
      #
      # Entry-point libraries only.  The first cut of this also demanded
      # libvorbis.so.0 and libogg.so.0 and failed the build: linking against
      # the runtime's libvorbisfile leaves those two transitive rather than
      # direct DT_NEEDED entries, where our own nixpkgs build records all
      # three.  libvorbisfile is the one the engine actually calls and the one
      # USE_CODEC_VORBIS gates, so its presence is the property worth
      # asserting.  uhexen2-bvei.
      #
      # libfluidsynth.so.3 is back in this list as of the uhexen2-rp1z fix.
      # This guard is what caught that the Flatpak had never detected
      # FluidSynth at all -- the build logged "FluidSynth MIDI: not found,
      # disabled", compiled midi_nul.c and fell back to libTiMidity, leaving
      # the fluidsynth module, its stripped-out audio backends and the 6 MB
      # soundfont this manifest bundles all inert.  It was narrowed out of the
      # loop only so master would not wedge on a pre-existing bug.  Now that
      # the libdir is pinned above, asserting the SONAME is what proves the
      # fix took and stops it regressing silently a third time.
      - |
        for so in libvorbisfile.so.3 libopusfile.so.0 libxmp.so.4 libfluidsynth.so.3; do
          grep -qa "$so" /app/bin/glhexen2 || {
            echo "FATAL: glhexen2 did not link $so -- a codec was silently disabled"
            exit 1
          }
        done
      - install -Dm755 ../flatpak/hexenwail.sh /app/bin/hexenwail.sh
      # Demo fetch helper, offered by hexenwail.sh when no game data is
      # present.  A downloader, not game content -- nothing Raven owns is in
      # this bundle, and none of it could be (uhexen2-3vmk).  uhexen2-49ep.
      - install -Dm755 ../scripts/get_demo.sh /app/bin/get_demo.sh
      - install -Dm644 ../flatpak/io.github.hexenwail.hexenwail.desktop /app/share/applications/io.github.hexenwail.hexenwail.desktop
      - install -Dm644 ../flatpak/io.github.hexenwail.hexenwail.metainfo.xml /app/share/metainfo/io.github.hexenwail.hexenwail.metainfo.xml
      - install -Dm644 ../engine/resource/hexen2.png /app/share/icons/hicolor/128x128/apps/io.github.hexenwail.hexenwail.png
