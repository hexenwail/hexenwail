name: Set up Nix

description: Install the pinned Nix action and configure the project Cachix cache.

inputs:
  cachix-auth-token:
    description: Optional Cachix auth token.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = true

    - uses: cachix/cachix-action@v17
      continue-on-error: true
      with:
        name: hexenwail
        authToken: ${{ inputs.cachix-auth-token }}
