name: Security scan

# Neither Dependabot nor Renovate understands Nix flakes, so nothing was
# watching what nixpkgs pulls into the shipped binary.  This does two things
# Dependabot cannot: scan the built runtime closure against NVD, and report
# how stale the pinned flake inputs are.
#
# Both jobs are advisory.  They write to the run summary and upload a report
# rather than failing the build: a CVE in some transitive library of a
# single-player game engine is worth knowing about, not worth blocking a
# release on, and a scanner that cries wolf weekly gets muted.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/security-scan.yml'
      - '.github/vulnix-whitelist.toml'
      - 'scripts/vulnix-report.py'
      - 'tools/test_vulnix_report.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cve-scan:
    name: CVE scan (vulnix)
    runs-on: ubuntu-latest
    # Observed runtime is well under a minute to a few minutes; this is a
    # "something is stuck" threshold, not a target, and is sized to leave
    # room for a cold cache.  Without it the job inherits GitHub's 6-hour
    # default.  uhexen2-bvei.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # First and bare: a renderer bug is a code bug, not an advisory finding,
      # and it should fail in a second rather than after the closure build.
      - name: Test the report renderer
        run: python3 tools/test_vulnix_report.py

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # vulnix downloads the NVD JSON feeds (hundreds of MB) on a cold cache.
      #
      # Rolling, not weekly -- an earlier comment here claimed weekly, which
      # the key never did.  A run_id key can never hit exactly, so every run
      # restores the newest entry via the vulnix-nvd- prefix, tops it up and
      # saves it forward.  That is the behaviour we want: NVD publishes
      # continuously rather than weekly, so pinning the key to a week would
      # serve a deliberately stale feed for up to seven days.  The cost is one
      # new cache entry per run, and this workflow runs weekly plus the odd PR
      # touching flake.lock, so it is nowhere near the 10 GB budget.
      - name: Restore NVD feed cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-${{ github.run_id }}
          restore-keys: |
            vulnix-nvd-

      - name: Build runtime closure
        run: nix build .#nixos --print-build-logs

      - name: Scan closure against NVD
        id: scan
        run: |
          # -w filters the closure-only noise.  vulnix scans every store path
          # the build refers to, which is far more than the engine loads; the
          # whitelist records, with a written reason each, the packages that
          # no untrusted input can reach.  See .github/vulnix-whitelist.toml —
          # anything the engine can be made to parse is deliberately absent
          # from it.  (uhexen2-c58o)
          #
          # One run, JSON, with -s so the whitelisted entries stay in: the
          # uploaded JSON keeps the full picture and the filtered text report
          # is rendered from it in the next step.  This used to be a second
          # full vulnix run in text mode, about half of a ~49s step.
          #
          # vulnix exits non-zero when it finds anything, in JSON mode too:
          # 2 for findings, 1 for whitelisted-only entries under -s, and 2
          # again for a RuntimeError such as unreachable NVD feeds.  So the
          # exit code cannot tell findings from failure.  Swallow it, and
          # hand it to the renderer, which decides from the JSON and uses
          # the code only as a cross-check.  If VULNIX_RC is never set, the
          # renderer knows this step did not run.  No pipefail: nothing
          # here is piped any more.
          #
          # nixpkgs#vulnix resolves the registry's nixpkgs, not flake.lock,
          # so it can move past the 1.12.4 the renderer was written against.
          # The renderer treats per-entry keys other than affected_by as
          # optional for that reason.
          rc=0
          nix run nixpkgs#vulnix -- --closure ./result --json \
            -w .github/vulnix-whitelist.toml -s \
            > vulnix-report.json || rc=$?
          echo "vulnix exited $rc (0 nothing, 1 whitelisted only, 2 findings or error)"
          echo "VULNIX_RC=$rc" >> "$GITHUB_ENV"

      # Writes the filtered text report and the summary, and names the
      # outcome: not run, failed, suspicious, clean or findings.  The
      # definitions are in the script.  The old test was
      # [ -s vulnix-report.txt ], but vulnix's text output is never empty
      # ("Found no advisories.  Excellent!"), so its "no findings" branch
      # only ever fired when vulnix had crashed.  An empty `[]` is not an
      # all-clear either: vulnix silently skips closure paths whose deriver
      # it cannot find.  Advisory like the rest of the job: always exits 0.
      - name: Summarise
        if: always()
        run: python3 scripts/vulnix-report.py vulnix-report.json vulnix-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnix-report
          path: |
            vulnix-report.txt
            vulnix-report.json
          if-no-files-found: warn
          retention-days: 30

  flake-freshness:
    name: Flake input freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Report pinned input ages
        run: |
          nix flake metadata --json > flake-metadata.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, time

          STALE_DAYS = 60

          meta = json.load(open("flake-metadata.json"))
          nodes = meta.get("locks", {}).get("nodes", {})
          now = time.time()

          rows, stale = [], []
          for name, node in sorted(nodes.items()):
              locked = node.get("locked")
              if not locked or "lastModified" not in locked:
                  continue          # the root node has no lock of its own
              age = int((now - locked["lastModified"]) / 86400)
              rev = (locked.get("rev") or "")[:12]
              # A github: input pins a branch in `original` and resolves it to
              # a bare rev in `locked`, so the branch name only survives here.
              orig = node.get("original", {})
              where = "/".join(p for p in (orig.get("owner"), orig.get("repo")) if p)
              ref = orig.get("ref") or locked.get("ref") or ""
              rows.append((name, f"{where} {ref}".strip(), rev, age))
              if age >= STALE_DAYS:
                  stale.append(name)

          print("## Flake input freshness\n")
          print("| input | source | rev | age (days) |")
          print("|---|---|---|---|")
          for name, source, rev, age in rows:
              mark = " ⚠️" if age >= STALE_DAYS else ""
              print(f"| `{name}` | {source} | `{rev}` | {age}{mark} |")
          print()
          if stale:
              print(f"Inputs older than {STALE_DAYS} days: "
                    + ", ".join(f"`{n}`" for n in stale) + ".")
              print("Refresh with `nix flake update` and re-run CI — an old "
                    "nixpkgs pin is how known-fixed CVEs stay in the shipped "
                    "binary.")
          else:
              print(f"All inputs are newer than {STALE_DAYS} days.")
          PY
