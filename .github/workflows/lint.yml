name: Lint

# Reusable so the tag build gets the same gate the branch build does.
# These checks used to live only in ci.yml, which carries `tags-ignore: **`,
# so release.yml -- the one build that reaches users -- ran none of them.
# That was safe only for as long as every tagged commit happened to have
# travelled through master first, which nothing enforced.  uhexen2-5zei.
on:
  workflow_call:

# Declared here rather than inherited: a called workflow's token is capped by
# the caller's grant, but saying it explicitly means a caller that grants more
# does not silently hand it to these steps.  Nothing here writes.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Observed runtime is well under a minute to a few minutes; this is a
    # "something is stuck" threshold, not a target, and is sized to leave
    # room for a cold cache.  Without it the job inherits GitHub's 6-hour
    # default.  uhexen2-bvei.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck and appstream
        run: |
          # The flatpak job below updates before installing; this one did not,
          # so it worked only for as long as the runner image's index stayed
          # fresh enough to still resolve these versions.  uhexen2-bvei.
          sudo apt-get update
          sudo apt-get install -y shellcheck appstream

      - name: Shellcheck
        run: |
          # -x so the Rust gates' `. scripts/lib/rust-gate.sh` is followed
          # and checked with them rather than reported as unreadable.
          shellcheck -x scripts/mkrelease.sh flatpak/hexenwail.sh \
            scripts/wasm-build.sh scripts/wasm-assemble-artifact.sh \
            scripts/wasm-validate-artifact.sh scripts/webgl-smoke-test.sh \
            scripts/demo-playback-smoke.sh scripts/wasm-boot-smoke.sh \
            scripts/quit-smoke.sh scripts/package-release.sh \
            scripts/check-rust.sh scripts/check-rust-abi.sh \
            scripts/check-rust-notices.sh scripts/lib/rust-gate.sh \
            scripts/check-rust-crc.sh scripts/check-rust-strlcpy.sh \
            scripts/check-rust-huffman.sh scripts/check-rust-mathlib.sh \
            scripts/check-rust-strlcat.sh \
            scripts/check-rust-info-str.sh \
            engine/rust/crc/tests/gen_fixtures.sh engine/rust/crc/tests/mutants.sh \
            engine/rust/strlcpy/tests/gen_fixtures.sh engine/rust/strlcpy/tests/mutants.sh \
            engine/rust/strlcat/tests/gen_fixtures.sh engine/rust/strlcat/tests/mutants.sh \
            engine/rust/huffman/tests/gen_fixtures.sh engine/rust/huffman/tests/mutants.sh \
            engine/rust/mathlib/tests/gen_fixtures.sh engine/rust/mathlib/tests/mutants.sh \
            scripts/check-rust-hashindex.sh \
            engine/rust/hashindex/tests/gen_fixtures.sh engine/rust/hashindex/tests/mutants.sh \
            engine/rust/info_str/tests/gen_fixtures.sh engine/rust/info_str/tests/mutants.sh

      # The metainfo is what GNOME Software and KDE Discover read, and Flathub
      # rejects a submission whose metainfo does not validate.  Nothing checked
      # it before, so breakage would only have surfaced at publish time.
      # Note this validates structure, not currency — release.yml is what keeps
      # the <releases> block from going stale.
      #
      # --no-net for the same reason release.yml carries it (327bd5510):
      # appstreamcli otherwise fetches every <url> in the file and treats an
      # unreachable one as a warning it exits non-zero on, so this step went
      # red when github.com had a bad minute rather than when the file was
      # wrong.  That is what failed release r5.  Structure is what we want
      # checked here.  uhexen2-vm9w, uhexen2-bvei.
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net --explain flatpak/io.github.hexenwail.hexenwail.metainfo.xml

      # emscripten.h defines a bare EMSCRIPTEN alias under a deprecation
      # pragma, so a guard spelled that way only works in translation units
      # that happen to include the header — it fails silently rather than
      # loudly, and would compile the desktop branch on WASM.  uhexen2-uf5s.
      # The if(EMSCRIPTEN) uses in engine/CMakeLists.txt are CMake variables,
      # not C macros, so this is deliberately scoped to C sources.
      - name: No bare EMSCRIPTEN guards in C sources
        run: |
          if grep -rnE '(^|[^_A-Za-z])EMSCRIPTEN([^_A-Za-z]|$)' \
               --include='*.c' --include='*.h' engine/; then
            echo "::error::use __EMSCRIPTEN__, not the deprecated bare EMSCRIPTEN"
            exit 1
          fi

      # A second backend (SDL_GPU, #447) needs one place that knows the
      # whole draw state (gl_pipeline.h:20).  No glFoo_fp or raw glFoo call
      # outside engine/h2shared/gl_*.c and engine/hexen2/gl_*.c, except
      # the web canvas blit (web_canvas_gl2.c, raw GLES, no loader table).
      # uhexen2-ibnq.8, GitHub #453.
      - name: No GL calls outside the renderer modules
        run: python3 tools/test_gl_call_sites.py

      # gl_pipeline.c shadows the GL draw state and drops calls that would not
      # change it, which is only right while nothing writes that state behind
      # its back.  No draw-state call outside gl_pipeline.c, except the
      # context-time switches allowlisted in the script, the loader table
      # (gl_func.h) and the web canvas blit (web_canvas_gl2.c).  GitHub #337.
      - name: No draw-state GL call bypasses the pipeline
        run: python3 tools/test_draw_state_routing.py

      # gl_texbind.c shadows what every texture unit holds and which unit is
      # active, and drops binds that would not change them, which is only
      # right while nothing binds, switches units or deletes a texture behind
      # its back.  No glActiveTexture / glBindTexture / glBindImageTexture /
      # glDeleteTextures (or sampler / multi-bind) call outside gl_texbind.c,
      # except the loader table (gl_func.h) and the web canvas blit
      # (web_canvas_gl2.c); and the shadow itself checked against a fake GL.
      # GitHub #338.
      - name: No texture bind bypasses gl_texbind.c
        run: python3 tools/test_texture_bind_routing.py

      - name: gl_texbind.c shadow agrees with GL
        run: python3 tools/test_texbind_shadow.py

      # Texture creation, upload and sampling state go through gl_texcreate.c,
      # whose entry points name the texture they act on -- the shape the
      # SDL_GPU backend needs, and the one place it will branch.  No
      # glGenTextures / glTexImage* / glTexSubImage* / glTexStorage* /
      # glCompressedTex* / glCopyTex* / glTexParameter* / glGenerateMipmap /
      # sampler-object call, nor an unpack glPixelStore, outside it, except
      # the loader table (gl_func.h), the generated null-GL table (rg_null.c)
      # and the web canvas blit (web_canvas_gl2.c).  GitHub #340 (P1a).
      - name: No texture creation bypasses gl_texcreate.c
        run: python3 tools/test_texture_create_routing.py

      # Vertex and index buffers, vertex-array state and draws go through
      # gl_buffer.c's seams (GL_BindBuffer, R_GenBuffers, R_BufferData,
      # R_GenVertexArrays, R_BindVertexArray, R_VertexAttribPointer,
      # R_VertexAttrib4f, ...) and gl_vbo.c's (R_DrawElements*, GL_ImmEnd),
      # whose SDL_GPU arms the backend draws from.  No raw glGenBuffers /
      # glBufferData on a vertex target / glBindVertexArray / glVertexAttrib*
      # / glDraw* elsewhere, bar a ledger of the paths -gpu does not run yet,
      # each with an exact count; the compute passes left it at P5a-1
      # (R_DrawElementsIndirect is gl_vbo.c's).  GitHub #340 (P2d).
      - name: No buffer, vertex-array or draw call bypasses the seams
        run: python3 tools/test_buffer_routing.py

      # The other half: rg_buffer.c's shadow of that state is GL's.  Compiles
      # the real file against a fake SDL_GPU and frame recorder and checks the
      # binding rules, uploads and cycling, the segment hazard, name-table
      # growth and name reuse.  GitHub #340 (P2d).
      - name: rg_buffer.c shadows GL buffer and vertex-array state
        run: python3 tools/test_rg_buffer_shadow.py

      # rg_frame.c's asynchronous readback ring (gl_hiz_stats under -gpu),
      # lifted and run against a fake SDL_GPU whose fences signal on cue: a
      # read is mapped only after its download ran, one fence per submit is
      # released once and never queried after, slots are freed when done,
      # discarded or abandoned and never while in flight.  GitHub #340 (P5c).
      - name: rg_frame.c's readback ring keeps its promises
        run: python3 tools/test_rg_readback_ring.py

      # Every GPU program is built by id (gl_progid.h) through
      # R_Program_Create, from its row of gl_shader.c's program table: no
      # glCreateShader / glShaderSource / glCompileShader / glCreateProgram /
      # glAttachShader / glLinkProgram / glBindAttribLocation outside it,
      # every R_Program_Create argument provably an id, one row per id, each
      # stage's blob the offline copy EmbedShaders writes for its #define
      # set, a reflection row (gl_progid_refl.h) per offline copy, and no
      # id nothing builds.  SDL_GPU creates shaders from those blobs and
      # counts.  The SPIR-V half (the counts match the .vk.spv) runs in
      # shaders-spirv.yml.  GitHub #340 (P1b).
      - name: Every program is built by id from the program table
        run: python3 tools/test_program_routing.py

      # The linker already guarantees the software build *defines* every
      # renderer cvar shared code touches -- r_soft_web.c exists for that, and
      # CI builds the WEBSOFT config on every PR.  What nothing catches is a
      # menu row whose cvar no software translation unit ever reads: it links,
      # it draws, and it moves nothing.  This holds every row in a submenu
      # with a WEBSOFT arm to an explicit hidden/soft-ok decision, and checks
      # the soft-ok claims against the sources CMake actually compiles.
      - name: Software-renderer menu parity
        run: python3 tools/menu_soft_parity.py

      # EF_SPIN and EF_FLOAT are per-entity model flags.  The GL/GLES path
      # already consumes them; keep the software alias transform and lighting
      # path from silently falling back to the raw MDL EF_ROTATE bit.
      - name: Software model-effect parity
        run: python3 tools/test_software_model_flags.py

      # Both web builds can share one config.cfg, so every cvar they both
      # register must default and archive alike; one listed exception
      # (r_waterwarp).  Also reports cvars only one registers (#104, #362).
      - name: Software renderer cvar defaults match GL
        run: python3 tools/test_soft_cvar_defaults.py

      # ci.yml splits scripts/check-rust.sh across a job matrix.  A plan that
      # dropped an item would leave every shard green, so the partition is
      # checked here, where it fails in seconds rather than never.
      - name: Rust gate shards cover every item exactly once
        run: python3 tools/test_rust_gate_shards.py

      # The differential harnesses kill a call that spins; timed by wall clock,
      # a busy runner turned an ordinary return into a "spin" and failed
      # sv_main_inv on a commit that passed on rerun.  CPU time only.
      - name: Rust harnesses time spins by CPU, not wall clock
        run: python3 tools/test_harness_cpu_timers.py

      # Data-free coverage for the unified multiplayer path. The harness
      # extracts the production C functions rather than maintaining a Python
      # reimplementation, then compiles them against narrow engine stubs.
      - name: Multiplayer join and content-path regression
        run: python3 tools/test_multiplayer_join.py

      # Long mod titles shorten in the middle, so numbered sequels stay
      # distinct rows (#136).  Compiles the real M_Mods_FitLabel.
      - name: Mods menu labels stay distinct when shortened
        run: python3 tools/test_mods_label_fit.py

      # misc_modelpimp spawnflag 64 suppresses every standing dlight an
      # entity casts, and deliberately not the muzzle flash (#140).  Lifts
      # the dlight block out of CL_RelinkEntities and counts allocations.
      - name: misc_modelpimp flag 64 gates dynamic lights
        run: python3 tools/test_modelpimp_nodlight.py

      # misc_modelpimp spawnflags 4+16 draws one orb at its controller, which
      # the server never sends (EF_NODRAW), and 4 alone adds none there
      # (#518).  Lifts PF_pimpmodel's self_orb test and R_DrawAllGlows.
      - name: misc_modelpimp self-only orb draws at its controller
        run: python3 tools/test_modelpimp_selforb.py

      # misc_modelpimp spawnflags 8+16 casts one light from its controller,
      # through the same CL_PimpCastLight as a visible entity, once, and not
      # with flag 64 (#522).  Runs the real list and dlight code, GL and soft.
      - name: misc_modelpimp self-only cast light comes from its controller
        run: python3 tools/test_modelpimp_selflight.py

      # maplist, the map menu and the other name listings must see inside
      # mounted .pk3s, in the shipped Rust quakefs and the C reference (#129).
      - name: Name listings see inside pk3 archives
        run: python3 tools/test_pk3_listing.py

      # pak -> pk3 keeps duplicate members, exact sizes and pak order (#129).
      # Synthetic paks, no game data.
      - name: pak2pk3 converter
        run: python3 tools/test_pak2pk3.py

      # jsh2colour lights the Portals candles and the lanterns orange like
      # the other flames, and its usage line names argv[0]
      # (sezero/uhexen2#80).  Compiles the real classname test and printf.
      - name: jsh2colour colours candles and lanterns
        run: python3 tools/test_jsh2colour_orange.py

      # Every Raven release in pr_raven_images[] is named, a row needs both
      # CRCs, and the table agrees with tools/progs_crc.py (#160).
      - name: Raven gamecode releases are named
        run: python3 tools/test_progs_release_ident.py

      # The software renderer draws its own copy of the demo playback bar;
      # it must stay the GL copy's code (#123).
      - name: Demo bar copies agree
        run: python3 tools/test_demobar_copies.py

      # A demo has no qsocket, so a guard written for HexenWorld's socket
      # ownership froze every demo on the loading plaque until "load timeout"
      # (30ea43b17, GitHub #209).  Mods driving their front end from
      # startdemos -- Storm of the Thyrion, Shadows of Chaos -- had no menu at
      # all.  Nothing ran a demo: data1's hexen.rc plays none, and the
      # headless lanes reach the world with +map.
      - name: Demo playback reachable from the frame loop
        run: python3 tools/test_demo_playback_gate.py

      # Skybox faces live in gl_texmgr.c's own pool, outside gltextures[], so
      # imagelist/imagedump could not see them (issue #127).
      # Compiles the real gl_texmgr.c against stubs and checks both commands
      # still walk that pool.
      - name: TexMgr pool visible to imagelist/imagedump
        run: python3 tools/test_texmgr_image_enum.py

      # A two-sided Z ripple lifted the water's edge off every sloped floor
      # it touched (GitHub #312).  Compiles the real R_WaterRipple and checks
      # it never rises above the rest plane.
      - name: Liquid ripple stays at or below the surface
        run: python3 tools/test_water_ripple.py

      # r_fastsky only reached the skybox path; the classic scrolling sky
      # ignored it, and its fill colour was computed in a dead function
      # (GitHub #323).  Checks both classic draw paths branch on the cvar
      # and that R_InitSky, the live loader, sets skyflatcolor.
      - name: r_fastsky reaches the classic sky
        run: python3 tools/test_fastsky_classic.py

      # The scrolling sky ignored r_skyfog under fog: R_SetSkyFog had no
      # caller and the two-pass layers had no fog pass (GitHub #486).  Pins
      # the per-frame write in Fog_SetupFrame and both two-pass fog passes;
      # and the skybox is never skipped on skyfog (GitHub #487).
      # Fog_GetColor clamps as Ironwail does, and R_SetSkyFog alone writes
      # fragparams.skyfog (the #486 review).
      - name: Sky fog reaches the scrolling sky
        run: python3 tools/test_skyfog_layers.py

      # r_softemu_spans: the 1997 span rasteriser's texture coordinates on the
      # world, brush polys and liquids, at 1997's proportion (GitHub #176).
      - name: Retro spans reach every span-drawn surface
        run: python3 tools/test_softemu_spans.py

      # Lightstyles animated on the GPU, no lightmap rebuild (#439).
      - name: GPU lightstyles
        run: python3 tools/test_gpu_lightstyles.py

      # The worldcull compute family rides one CullParams block (#19):
      # no loose uniform uploads or location queries may remain in
      # gl_worldcull.c outside the R_DrawWorldCulled world draws, and
      # the C mirror must agree with the GLSL block member for member.
      - name: CullParams block covers the worldcull compute family
        run: python3 tools/test_cullparams_block.py
      # The Hi-Z cull compares in the depth range its pyramid was drawn
      # in: half of it at r_mirroralpha != 1 (#533).
      - name: Hi-Z cull compares in its pyramid's depth range
        run: python3 tools/test_hiz_depthrange.py
      - name: r_ssao entity contact occlusion (#188)
        run: python3 tools/test_ssao.py

      # hwsv falls back to the hwprogs.dat shipped beside it (#37).
      - name: hwsv bundled gamecode fallback
        run: python3 tools/test_hwsv_bundled_progs.py

      # r_oit 2: moment-based OIT (#87).
      - name: Moment-based OIT
        run: python3 tools/test_mboit.py

      # The 128^3 softemu LUT's CPU builder equals a full scan (#80).
      - name: Softemu LUT builder is exact
        run: python3 tools/test_softemu_lut.py

      # The -gpu softemu sweep's palette dumper and membership counter, and
      # its steps file and diff script naming the same frames (#340 P4d).
      - name: Softemu sweep palette tools
        run: python3 tools/test_softemu_palette.py

      # The AppImage's AppRun picks the basedir like the zip (#173).
      - name: AppImage AppRun
        run: python3 tools/test_appimage_apprun.py

      # The rendering audit's deferred tail (#174).
      - name: Rendering audit tail
        run: python3 tools/test_audit_tail_174.py

      # sv_maxdatagram caps the per-frame datagram (#82).
      - name: sv_maxdatagram
        run: python3 tools/test_sv_maxdatagram.py

      # cl_startmenu, Ironwail's start-at-the-menu toggle (#273).
      - name: cl_startmenu
        run: python3 tools/test_cl_startmenu.py

      # Demo rewind: keyframes and silent replay (#76).
      - name: Demo rewind
        run: python3 tools/test_demo_rewind.py

      # joy_always_active gates rumble and gyro (#409).
      - name: joy_always_active
        run: python3 tools/test_joy_always_active.py

      # Maps browser skill step resumes an autosave (#410).
      - name: Maps browser resume
        run: python3 tools/test_maps_resume.py

      # sv_autoload: death loads the last save on this map (#410).
      - name: sv_autoload
        run: python3 tools/test_sv_autoload.py

      # max_edicts 16384 of 32000; sounds past entity 8192 (#411).
      - name: Edict ceiling and large-entity sounds
        run: python3 tools/test_max_edicts.py

      # contrast is Ironwail's multiplier, clamped 1..2.
      - name: Contrast parity
        run: python3 tools/test_contrast_parity.py

      # The WebGL2 fixes from verifying the ES tier in a browser (GitHub #112).
      - name: WebGL2 ES-tier fixes
        run: python3 tools/test_webgl2_es_fixes.py

      # Particles stand still while the game is paused.
      - name: Particles pause
        run: python3 tools/test_particles_pause.py

      # Headless (offscreen) runs stay windowed, so screenshots are the
      # frame and nothing else (GitHub #401).
      - name: Offscreen driver windowed
        run: python3 tools/test_offscreen_windowed.py

      # A brush entity's abslight is lit like a lightmap sample of it, as
      # the software renderer does (GitHub #326, the dark pillars).
      - name: Brush abslight scale
        run: python3 tools/test_brush_abslight.py

      # scr_sbaralpha fades the bottom bar on GL and nothing else (GitHub #83).
      - name: Status bar alpha
        run: python3 tools/test_sbar_alpha.py

      # gfx.wad and the 2D lumps load from the C heap, so a mod's bigger
      # gfx.wad cannot abort startup (GitHub #126).
      - name: gfx.wad off the secondary zone
        run: python3 tools/test_gfx_malloc.py

      # The progs known-string tables grow with realloc and zero the new
      # slots; Z_Realloc wrote its split header into uncopied slots (GitHub #488).
      - name: Known-string tables off the zone
        run: python3 tools/test_knownstrings_heap.py

      # 320x200 is a valid mode again, and the main menu fits (GitHub #135).
      - name: Video mode floor 320x200
        run: python3 tools/test_vid_floor_200.py

      # r_showtris outlines alias models, sprites, particles and the
      # viewmodel, from the geometry their draws use (GitHub #81).
      - name: r_showtris covers models, sprites and particles
        run: python3 tools/test_showtris_models.py

      # r_lerp_autodetect snaps the violent pose pairs, not the whole model
      # (GitHub #94).
      - name: Lerp autodetect per pose pair
        run: python3 tools/test_lerp_pair_snaps.py

      # The headless driver's sandbox keeps the engine userdir where the
      # script reads it, even for an outdir under $HOME.
      - name: Headless driver binds
        run: python3 tools/test_headless_drive_binds.py

      # A step file's level load goes `console` + `enter map X`, never `cmd`:
      # cmd's closing console toggle lands mid-load and pins the console up
      # (#553, the mirror sweep's floor frames).
      - name: Step files load levels without a toggle in flight
        run: python3 tools/test_steps_level_load.py

      # The loading plaque redraws, throttled, with each join stage on a
      # status line, Hexen II and HexenWorld, both renderers (#571).
      - name: Loading plaque stays live through a join
        run: python3 tools/test_loading_status.py

      # Dedicated servers default to the client's 512 MB heap, and running
      # out names -heapsize (in KB) (GitHub #79).
      - name: Dedicated server heap
        run: python3 tools/test_dedicated_heap.py

      # A disconnected client renders no world: the loading plaque used to
      # redraw the map just left, after the disconnect (GitHub #204).
      - name: No world render while disconnected
        run: python3 tools/test_render_disconnected.py

      # Alias GPU meshes are found through the header, not its address,
      # which the loader frees before the first draw (GitHub #134).
      - name: Alias meshes keyed by header
        run: python3 tools/test_alias_mesh_key.py

      # The web build, the Linux release and the Flatpak bundle one TimGM6mb
      # from one Debian tarball; the pin must agree everywhere (GitHub #114).
      - name: One SoundFont pin
        run: python3 tools/test_soundfont_pin.py

      # csprogs.dat images the old hcc built (a vector operand on the last
      # globals, a builtin record at the end) load, and nothing they run can
      # reach past the globals or enter a builtin (GitHub #120).
      - name: Old-hcc CSQC images load safely
        run: python3 tools/test_csqc_tail_slack.py

      # An edict created during the physics walk waits for the next frame,
      # whatever slot it took, so a projectile is first seen where it was
      # spawned at any tick rate (GitHub #138).
      - name: New edicts wait for the next physics frame
        run: python3 tools/test_spawn_walk.py

      # The Options submenus' row notes fit the canvas and name the cvar the
      # row sets, so a rewired row cannot keep a stale note (GitHub #98).
      - name: Menu row notes fit and stay true
        run: python3 tools/test_menu_row_notes.py

      # EF_TRANSPARENT alias skins have r_wateralpha baked into their alpha,
      # so a change reached world water and never the models (GitHub #124).
      # Compiles the real cache test, clamp and callback.
      - name: r_wateralpha re-uploads EF_TRANSPARENT skins
        run: python3 tools/test_wateralpha_reupload.py

      # Relative mouse mode kills menu hover.  Focus regained, unpause and
      # _enable_mouse took the mouse back behind an open menu, and the
      # Options menu grabbed it every frame (GitHub #91).
      - name: A menu keeps the pointer free
        run: python3 tools/test_menu_mouse_grab.py

      # The demo refused -game at startup and accepted "game mymod" at
      # runtime, and the main menu offered MODS regardless (GitHub #171).
      - name: Mods need the full game
        run: python3 tools/test_demo_mods_gate.py

      # ARE_WE_IRONWAIL_YET.md carries a summary table over rows kept further
      # down the same file, and the two drift every time somebody flips a row
      # by hand.  The file records this happening in 2026-08-20 and twice on
      # 2026-08-31; the parser was written the second time and committed the
      # third, "so the next edit cannot skip it".  It was skipped anyway --
      # two flips reached the rows and not the header -- because nothing ran
      # it.  Now something does.
      - name: Ironwail scorecard matches its own rows
        run: python3 tools/ironwail_scorecard.py --check


      # The vendored SDL3 still declares every SDL_GPU capability #77's
      # backend plan rests on (#452): a vendored-SDL bump that drops one
      # fails here instead of surfacing mid-#340.
      - name: SDL_GPU feasibility list holds for the vendored SDL3
        run: python3 tools/test_sdl_gpu_feasibility.py

      # The Flatpak's FluidSynth has libsndfile off, so it must carry the
      # vorbisfile SF3 patch too, or SF3 soundfonts are refused (#168).
      - name: Flatpak FluidSynth decodes SF3 without libsndfile
        run: python3 tools/test_flatpak_sf3.py

      # The light-cluster pass's LcParams block and its C mirror agree, and
      # no loose uniform plumbing is left for it (#450).
      - name: LcParams block covers the light-cluster pass
        run: python3 tools/test_lcparams_block.py

      # The bloom passes' BloomParams block and its C mirror agree, and its
      # upload avoids GL_Upload, which is a stub on the ES tier (#450).
      - name: BloomParams block covers the bloom passes on both tiers
        run: python3 tools/test_bloomparams_block.py

      # A pass that switches the blend func puts GL_SRC_ALPHA,
      # GL_ONE_MINUS_SRC_ALPHA back: the bloom upsample left GL_ONE, GL_ONE
      # and the sky's front layer went additive until restart (#547).
      - name: Every blend func change is restored
        run: python3 tools/test_blend_func_restore.py

      # Depth ranges come from the frame's range, never window-Z constants:
      # the skybox put back (0, 1) and at r_mirroralpha < 1 every entity after
      # it wrote depth across all of window Z, over the reflection's half (#552).
      - name: Every depth range names the frame's range
        run: python3 tools/test_depth_range_frame.py

      # The shader include expander and its WebGL-smoke mirror allow the same
      # number of passes, and no stage exceeds it (#450).
      - name: Shader include bound
        run: python3 tools/test_embed_include_bound.py

      # No C string literal under engine/h2shared or engine/hexen2 holds a
      # GLSL #version: the tier preambles and the WEBSOFT canvas blit live in
      # engine/shaders/glonly, embedded as macros (#450).
      - name: No #version string in the C
        run: python3 tools/test_no_version_in_c.py

      # Every stage + #define set the C can build at run time (the NOPERSP
      # twins, SSAO QUALITY, softemu MODE, the froxel-grid constants) is in
      # engine/shaders/variants.txt, so the offline SPIR-V gate compiles a
      # blob for each; SDL_GPU cannot compile GLSL at run time.  Also refuses
      # glslang's --invert-y in CompileSpirv, which is HLSL-only and a silent
      # no-op on GLSL.  Source-only; the build-side half runs in
      # shaders-spirv.yml (#340).
      - name: Shader variants manifest covers the runtime header defines
        run: python3 tools/test_shader_variants.py

      # Every engine/shaders vertex stage ends main(), and precedes each
      # early return, with layout.inc's VK_FLIP_Y(): gl_Position.y negated
      # in the Vulkan arm only, nothing at all in the GL arms.  The compiled
      # half runs in shaders-spirv.yml (#340, Y flip).
      - name: Vertex stages flip Y for SDL_GPU only
        run: python3 tools/test_vk_flip_y.py

      # The SDL_GPU backend (engine/h2shared/rg_*.c) is built into the
      # desktop GL client alone: CMake names it only under USE_SDL_GPU, forces
      # that off for GLES / web / non-GL_DLSYM builds, and keeps the define off
      # h2ded and hwsv; every reference elsewhere is under #ifdef USE_SDL_GPU,
      # so the WEBSOFT build cannot fail to link on it.  Also: no
      # SDL_GL_GetProcAddress load runs under -gpu, where it would write NULL
      # over a null-GL stub (#340 P0).  And glslangValidator is required only
      # under USE_SDL_GPU, which embeds the SPIR-V; the flake gives glslang to
      # the SDL_GPU client builds alone (#340 decision 6).
      - name: SDL_GPU backend stays in the desktop GL client
        run: python3 tools/test_rg_sources.py

      # rg_target.c compiled against a fake SDL_GPU and frame recorder:
      # glDrawBuffers is the draw side's alone, a bad attachment is replaced
      # like any other, every change to the bound draw framebuffer
      # re-resolves the frame's target, a blit comes after the segment's
      # end; and RGT_FlushIfRead lifted: an upload into the bound target
      # behind a pending clear ends the segment first (#548).
      - name: SDL_GPU framebuffers keep GL's rules
        run: python3 tools/test_rg_target.py

      # GL_SoftDepth_Capture lifted out of gl_postprocess.c and run against
      # rg_target.c and the same fakes: under -gpu the soft-particle snapshot
      # is taken, from framebuffer 0 or pp_fbo (whichever is drawn into), at
      # r_scale's size, and is valid only if the depth copy was made (#340 P4b).
      - name: SDL_GPU soft-particle depth snapshot
        run: python3 tools/test_soft_depth_gpu.py

      # r_pp_time, the screen warp's clock: -1 (the default) is exactly the
      # realtime every warp-time write used before, so GL frames do not move;
      # >= 0 holds the phase for tools/sweep-warp-gpu.steps, whose shots all
      # run with it held, and whose warp model (tools/warp-model.py) tells
      # the honest warp from a flipped, doubled or unfrozen one (#340 P4c).
      - name: Post-process warp clock and the warp sweep's model
        run: python3 tools/test_pp_time.py

      # tools/sweep-mirror-gpu.steps' test game: the miptex rename and each
      # refusal (two planes, a brush entity, a map that already has a
      # mirror ...) on a synthetic BSP, so the sweep's map cannot quietly
      # become one whose mirror is wrong (#340 P3d).
      - name: Mirror test game generator refuses a bad mirror
        run: python3 tools/mk-mirror-testgame.py --self-test

      # tools/sweep-dlight-gpu.steps' test game: three of demo2's torches
      # named so they keep their dynamic light, the cast scene's torch and
      # barrel added, every monster dropped, and each refusal (a torch
      # missing, doubled or already named) on a synthetic BSP, so the
      # sweep's cameras cannot quietly lose their lights (#340 P5b).
      - name: Dlight test game generator names the sweep's torches
        run: python3 tools/mk-dlight-testgame.py --self-test

      # R_Mirror puts back what the reflected pass derived from the reflected
      # view (the world frame's caustics, the light grid, the view matrix and
      # frustum) before the mirror's own surfaces draw, and r_speeds' counters
      # reset once a frame in R_RenderView, not per pass (#517).
      - name: Mirror restores the view's derived state
        run: python3 tools/test_mirror_view_state.py

      # A sampler's texture unit is set through R_ProgramSamplerLoc /
      # R_ProgramSamplerUnit, whose GL arms are the glGetUniformLocation /
      # glUniform1i pair and whose SDL_GPU arms write the unit into the
      # program's reflected samplers: no other caller but gl_postprocess.c's
      # OIT resolve (P6); the SSAO composite goes through the seam since P5a-1; every sampler of every routed program a
      # unit from the TMU constants, no two on one unit; and the backend's
      # reflection, unit seam and typed placeholders lifted and run
      # (#340 P2a).
      - name: Sampler units go through one seam
        run: python3 tools/test_rg_sampler_units.py

      # gl_lodbias reaches the SDL_GPU sampler's mip_lod_bias, and `auto`
      # scales from PP_SceneSamples, the samples the scene FBO is built with,
      # not vid_config_fsaa: 0 under -gpu until MSAA lands (GitHub #521).
      - name: gl_lodbias reaches -gpu, auto reads samples in use
        run: python3 tools/test_lod_bias_gpu.py
      # gl_max_size caps every texture upload.  Under -gpu it comes from
      # RG_MaxTextureSize (the backend's guaranteed floor: SDL 3.4 has no
      # query), never from rg_null.c's GL_MAX_TEXTURE_SIZE placeholder, and
      # nothing else writes it (#513).
      - name: -gpu texture limit comes from the device
        run: python3 tools/test_rg_max_size.py

      # rg_null.c, SDL_GPU mode's counting null GL table, is generated from
      # gl_func.h; a stale copy would leave a new entry point NULL under -gpu
      # (#340 P0).
      - name: Null GL table matches gl_func.h
        run: python3 tools/gen_rg_null.py --check

      # salias_vert reads VertParams: the C mirror matches the block member
      # for member (sizes AND int/float kinds), all four alias builds compile
      # the file, GL_ImmPushBlocks feeds it, MSL targets 2.1 (#450 S1).
      - name: Alias vertex stage on VertParams
        run: python3 tools/test_alias_vert_block.py

      # salias_frag reads FragParams and AliasFrag: the AliasFrag mirror and
      # its own binding, the .inc copies of the world's GLSL helpers, all ten
      # program builds, and every draw path writing the block members it reads
      # before it draws, since they are global where the loose uniforms were
      # per-program (#450 S2).
      - name: Alias fragment stage on FragParams + AliasFrag
        run: python3 tools/test_alias_frag_block.py

      # salias_inst_vert reads VertParams and AliasVert: both mirrors by
      # member name, the vertex-stage SSBO macros, the ShadedotRow constants
      # pinned to gl_shader.h, both instanced builds, and the per-batch
      # instance base set and flushed before every instanced draw in both
      # passes (#450 S3).
      - name: Instanced alias vertex stage on VertParams + AliasVert
        run: python3 tools/test_alias_inst_vert_block.py

      # sskeletal_vert reads VertParams and AliasVert: both mirrors by member
      # name, one setter per lane, the bones on VERT_SSBO, every input pinned
      # to the IQM VAO's slot, width and integer-ness, all four skeletal
      # builds, and GL_DrawAliasSkeletal writing every member the stage reads
      # before one unconditional flush and its draw (#450 S4).
      - name: Skeletal alias vertex stage on VertParams + AliasVert
        run: python3 tools/test_skeletal_vert_block.py

      # No alias-family program regains a loose non-opaque uniform: the names
      # the four alias stages read from blocks (derived, minus every name a
      # live shader still declares loose) have no location field, lookup,
      # glUniform write or GL_ImmEnd cache anywhere in C (#450 S5).
      - name: Alias family has no loose uniform plumbing
        run: python3 tools/test_alias_no_loose.py

      # sworld_vert reads VertParams: the mirror by member name, the two
      # matrices it reads and their setters, every input on its ATTR_* slot,
      # its outputs against both world fragment files, the three world
      # builds, and every world draw path (GL_ImmEnd, the fast path, deferred,
      # brush model, instanced, GPU-culled) writing both matrices before an
      # unconditional flush and its draws; a flow pass that follows world
      # programs and block writers through calls, pointers and locals, and
      # world_state_set to every FlushBatch (#450 world slice W1); and a
      # member pass that follows every world-read block slot, fragment set
      # included, through each of those paths to its draws (W2).
      - name: World vertex stage on VertParams
        run: python3 tools/test_world_vert_block.py
      # sworld_frag / sworld_opaque_frag read FragParams + WorldFrag: the
      # WorldFrag mirror by member name, its binding and upload, the files'
      # shared layout, pinned bodies on both tiers and ES arm, the world frame
      # record's writers and every path's R_SetWorldFrag arguments.  That
      # every path writes and flushes all of it before each draw is the member
      # pass in test_world_vert_block.py (#450 world slice W2).
      - name: World fragment stages on FragParams + WorldFrag
        run: python3 tools/test_world_frag_block.py

      # The OIT twins' output stage is engine/shaders/oit.inc, taken under
      # #ifdef OIT, and its mode switches are OitFrag's: the mirror and
      # binding, R_SetOITMode as the one writer at the four pass transitions,
      # every OIT draw flushing, the three stages' arms and slot counts, and
      # the desktop-only builds (#450 W3).
      - name: OIT twins on oit.inc + OitFrag
        run: python3 tools/test_oit_frag_block.py
      # r_fullbright flattens alias model light on every alias path: one
      # helper, both lighting setups through it, every consumer fed from it
      # and reached only from those setups (#490).
      - name: Alias models flat under r_fullbright
        run: python3 tools/test_alias_fullbright.py
      # The CPU alias glow draws at the base pass's pose blend, resolved once
      # per draw for both passes, as the instanced glow does (#493).
      - name: CPU alias glow at the base pass's blend
        run: python3 tools/test_alias_fullbright_lerp.py
      # A model the delta protocol is holding (skipped as unchanged) keeps its
      # pose and move lerps; only a real (re)appearance resets them (#494).
      - name: Held entities keep their lerps
        run: python3 tools/test_delta_held_lerp.py
      # Every value a shader reads comes through a std140 block; the only
      # glUniform* left is the sampler bind (#19), and that goes through
      # R_ProgramSamplerUnit (test_rg_sampler_units.py, #340 P2a).
      - name: No loose value uniforms
        run: python3 tools/test_no_loose_uniforms.py
      # A dynamic light behind a face does not light it, on every tier: the
      # CPU twins' R_AddDynamicLights prologue and R_MarkLights surface loop
      # lifted and run, the GPU test in ClusteredDlight, its WorldFrag lane,
      # writer and lit water's bracket pinned, and the cvar (#97).
      - name: Dynamic lights stop at the wall
        run: python3 tools/test_dlight_onesided.py
      # ...and at any wall, on the CPU light path: r_dlightvis.c compiled whole
      # and run on a synthetic BSP against bsp_dlight_leak.py's segments and
      # samples, and R_MarkLights' and the alias loops' hooks lifted and run
      # (#97 P2).
      - name: Dynamic lights do not see through walls
        run: python3 tools/test_dlight_vis.py
      # ...and on brush entities sharing one submodel, each light measured in
      # the space of the copy it came in through: r_dlightmark.c compiled
      # whole with both tiers' mark and add loops, run on two copies (#496).
      - name: Shared submodels keep their own lights
        run: python3 tools/test_dlight_shared_submodel.py
      # Both brush-entity dlight mark loops (R_DrawBrushModel and its
      # instanced twin) stand down under gl_flashblend and the GPU path.
      - name: Brush dlight mark loops share their gates
        run: python3 tools/test_brush_dlight_gates.py
      # ...and on the GPU clustered path, the cube shadow maps: the six face
      # matrices against GL's cube-map table and the cull face that keeps the
      # walls' far sides, and the ShadowPass / DlShadow blocks against their C
      # mirrors, binds, packing and an ES arm without them (#97 P3/P4); the
      # alias casters' pose, push and exclusions (#97 P6).
      - name: Shadow-map faces are GL's cube faces
        run: python3 tools/test_shadow_cube_faces.py
      - name: Shadow-map blocks match their mirrors
        run: python3 tools/test_dlshadow_block.py
      # r_speeds 2's GPU timestamps live in a ring of query sets, read only
      # once landed, so a GPU frames behind the CPU still reports every frame
      # (#503; the live count is tools/rspeeds-ssao-check.sh).
      - name: r_speeds 2 rings its timestamp queries
        run: python3 tools/test_rprof_ring.py
      # r_speeds 2 names -gpu's missing timer instead of allocating from the
      # null table's query stubs, and vid_restart drops the dead query names
      # (#540; the live check is tools/rprof-context-check.sh).
      - name: r_speeds 2 follows its backend and context
        run: python3 tools/test_rprof_context.py
      # The shadow-map unit holds a depth cube array on every frame, a 1x1
      # placeholder when there is no map, or every world and alias draw runs
      # its samplerCubeArrayShadow against texture 0 (#526).
      - name: Shadow-map unit always holds a depth cube array
        run: python3 tools/test_shadow_tmu_bound.py
      # The Display presets' shadow-map tiers, each preset detected as itself
      # after applying it, and the DLight Occlusion row (#97 P5).
      - name: Presets carry their shadow-map tier
        run: python3 tools/test_shadow_presets.py
