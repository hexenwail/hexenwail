name: Lint

# Reusable so the tag build gets the same gate the branch build does.
# These checks used to live only in ci.yml, which carries `tags-ignore: **`,
# so release.yml -- the one build that reaches users -- ran none of them.
# That was safe only for as long as every tagged commit happened to have
# travelled through master first, which nothing enforced.  uhexen2-5zei.
on:
  workflow_call:

# Declared here rather than inherited: a called workflow's token is capped by
# the caller's grant, but saying it explicitly means a caller that grants more
# does not silently hand it to these steps.  Nothing here writes.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Observed runtime is well under a minute to a few minutes; this is a
    # "something is stuck" threshold, not a target, and is sized to leave
    # room for a cold cache.  Without it the job inherits GitHub's 6-hour
    # default.  uhexen2-bvei.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck and appstream
        run: |
          # The flatpak job below updates before installing; this one did not,
          # so it worked only for as long as the runner image's index stayed
          # fresh enough to still resolve these versions.  uhexen2-bvei.
          sudo apt-get update
          sudo apt-get install -y shellcheck appstream

      - name: Shellcheck
        run: |
          # -x so the Rust gates' `. scripts/lib/rust-gate.sh` is followed
          # and checked with them rather than reported as unreadable.
          shellcheck -x scripts/mkrelease.sh flatpak/hexenwail.sh \
            scripts/wasm-build.sh scripts/wasm-assemble-artifact.sh \
            scripts/wasm-validate-artifact.sh scripts/webgl-smoke-test.sh \
            scripts/demo-playback-smoke.sh scripts/wasm-boot-smoke.sh \
            scripts/quit-smoke.sh scripts/package-release.sh \
            scripts/check-rust.sh scripts/check-rust-abi.sh \
            scripts/check-rust-notices.sh scripts/lib/rust-gate.sh

      # The metainfo is what GNOME Software and KDE Discover read, and Flathub
      # rejects a submission whose metainfo does not validate.  Nothing checked
      # it before, so breakage would only have surfaced at publish time.
      # Note this validates structure, not currency — release.yml is what keeps
      # the <releases> block from going stale.
      #
      # --no-net for the same reason release.yml carries it (327bd5510):
      # appstreamcli otherwise fetches every <url> in the file and treats an
      # unreachable one as a warning it exits non-zero on, so this step went
      # red when github.com had a bad minute rather than when the file was
      # wrong.  That is what failed release r5.  Structure is what we want
      # checked here.  uhexen2-vm9w, uhexen2-bvei.
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net --explain flatpak/io.github.hexenwail.hexenwail.metainfo.xml

      # emscripten.h defines a bare EMSCRIPTEN alias under a deprecation
      # pragma, so a guard spelled that way only works in translation units
      # that happen to include the header — it fails silently rather than
      # loudly, and would compile the desktop branch on WASM.  uhexen2-uf5s.
      # The if(EMSCRIPTEN) uses in engine/CMakeLists.txt are CMake variables,
      # not C macros, so this is deliberately scoped to C sources.
      - name: No bare EMSCRIPTEN guards in C sources
        run: |
          if grep -rnE '(^|[^_A-Za-z])EMSCRIPTEN([^_A-Za-z]|$)' \
               --include='*.c' --include='*.h' engine/; then
            echo "::error::use __EMSCRIPTEN__, not the deprecated bare EMSCRIPTEN"
            exit 1
          fi

      # The linker already guarantees the software build *defines* every
      # renderer cvar shared code touches -- r_soft_web.c exists for that, and
      # CI builds the WEBSOFT config on every PR.  What nothing catches is a
      # menu row whose cvar no software translation unit ever reads: it links,
      # it draws, and it moves nothing.  This holds every row in a submenu
      # with a WEBSOFT arm to an explicit hidden/soft-ok decision, and checks
      # the soft-ok claims against the sources CMake actually compiles.
      - name: Software-renderer menu parity
        run: python3 tools/menu_soft_parity.py

      # EF_SPIN and EF_FLOAT are per-entity model flags.  The GL/GLES path
      # already consumes them; keep the software alias transform and lighting
      # path from silently falling back to the raw MDL EF_ROTATE bit.
      - name: Software model-effect parity
        run: python3 tools/test_software_model_flags.py

      # Both web builds can share one config.cfg, so every cvar they both
      # register must default and archive alike; one listed exception
      # (r_waterwarp).  Also reports cvars only one registers (#104, #362).
      - name: Software renderer cvar defaults match GL
        run: python3 tools/test_soft_cvar_defaults.py

      # Data-free coverage for the unified multiplayer path. The harness
      # extracts the production C functions rather than maintaining a Python
      # reimplementation, then compiles them against narrow engine stubs.
      - name: Multiplayer join and content-path regression
        run: python3 tools/test_multiplayer_join.py

      # Long mod titles shorten in the middle, so numbered sequels stay
      # distinct rows (#136).  Compiles the real M_Mods_FitLabel.
      - name: Mods menu labels stay distinct when shortened
        run: python3 tools/test_mods_label_fit.py

      # misc_modelpimp spawnflag 64 suppresses every standing dlight an
      # entity casts, and deliberately not the muzzle flash (#140).  Lifts
      # the dlight block out of CL_RelinkEntities and counts allocations.
      - name: misc_modelpimp flag 64 gates dynamic lights
        run: python3 tools/test_modelpimp_nodlight.py

      # maplist, the map menu and the other name listings must see inside
      # mounted .pk3s, in the shipped Rust quakefs and the C reference (#129).
      - name: Name listings see inside pk3 archives
        run: python3 tools/test_pk3_listing.py

      # pak -> pk3 keeps duplicate members, exact sizes and pak order (#129).
      # Synthetic paks, no game data.
      - name: pak2pk3 converter
        run: python3 tools/test_pak2pk3.py

      # Every Raven release in pr_raven_images[] is named, a row needs both
      # CRCs, and the table agrees with tools/progs_crc.py (#160).
      - name: Raven gamecode releases are named
        run: python3 tools/test_progs_release_ident.py

      # The software renderer draws its own copy of the demo playback bar;
      # it must stay the GL copy's code (#123).
      - name: Demo bar copies agree
        run: python3 tools/test_demobar_copies.py

      # A demo has no qsocket, so a guard written for HexenWorld's socket
      # ownership froze every demo on the loading plaque until "load timeout"
      # (30ea43b17, GitHub #209).  Mods driving their front end from
      # startdemos -- Storm of the Thyrion, Shadows of Chaos -- had no menu at
      # all.  Nothing ran a demo: data1's hexen.rc plays none, and the
      # headless lanes reach the world with +map.
      - name: Demo playback reachable from the frame loop
        run: python3 tools/test_demo_playback_gate.py

      # Skybox faces live in gl_texmgr.c's own pool, outside gltextures[], so
      # imagelist/imagedump could not see them (issue #127).
      # Compiles the real gl_texmgr.c against stubs and checks both commands
      # still walk that pool.
      - name: TexMgr pool visible to imagelist/imagedump
        run: python3 tools/test_texmgr_image_enum.py

      # A two-sided Z ripple lifted the water's edge off every sloped floor
      # it touched (GitHub #312).  Compiles the real R_WaterRipple and checks
      # it never rises above the rest plane.
      - name: Liquid ripple stays at or below the surface
        run: python3 tools/test_water_ripple.py

      # r_fastsky only reached the skybox path; the classic scrolling sky
      # ignored it, and its fill colour was computed in a dead function
      # (GitHub #323).  Checks both classic draw paths branch on the cvar
      # and that R_InitSky, the live loader, sets skyflatcolor.
      - name: r_fastsky reaches the classic sky
        run: python3 tools/test_fastsky_classic.py

      # r_softemu_spans: the 1997 span rasteriser's texture coordinates on the
      # world, brush polys and liquids, at 1997's proportion (GitHub #176).
      - name: Retro spans reach every span-drawn surface
        run: python3 tools/test_softemu_spans.py

      # Dedicated servers default to the client's 512 MB heap, and running
      # out names -heapsize (in KB) (GitHub #79).
      - name: Dedicated server heap
        run: python3 tools/test_dedicated_heap.py

      # A disconnected client renders no world: the loading plaque used to
      # redraw the map just left, after the disconnect (GitHub #204).
      - name: No world render while disconnected
        run: python3 tools/test_render_disconnected.py

      # Alias GPU meshes are found through the header, not its address,
      # which the loader frees before the first draw (GitHub #134).
      - name: Alias meshes keyed by header
        run: python3 tools/test_alias_mesh_key.py

      # The web build, the Linux release and the Flatpak bundle one TimGM6mb
      # from one Debian tarball; the pin must agree everywhere (GitHub #114).
      - name: One SoundFont pin
        run: python3 tools/test_soundfont_pin.py

      # csprogs.dat images the old hcc built (a vector operand on the last
      # globals, a builtin record at the end) load, and nothing they run can
      # reach past the globals or enter a builtin (GitHub #120).
      - name: Old-hcc CSQC images load safely
        run: python3 tools/test_csqc_tail_slack.py

      # An edict created during the physics walk waits for the next frame,
      # whatever slot it took, so a projectile is first seen where it was
      # spawned at any tick rate (GitHub #138).
      - name: New edicts wait for the next physics frame
        run: python3 tools/test_spawn_walk.py

      # The Options submenus' row notes fit the canvas and name the cvar the
      # row sets, so a rewired row cannot keep a stale note (GitHub #98).
      - name: Menu row notes fit and stay true
        run: python3 tools/test_menu_row_notes.py

      # EF_TRANSPARENT alias skins have r_wateralpha baked into their alpha,
      # so a change reached world water and never the models (GitHub #124).
      # Compiles the real cache test, clamp and callback.
      - name: r_wateralpha re-uploads EF_TRANSPARENT skins
        run: python3 tools/test_wateralpha_reupload.py

      # Relative mouse mode kills menu hover.  Focus regained, unpause and
      # _enable_mouse took the mouse back behind an open menu, and the
      # Options menu grabbed it every frame (GitHub #91).
      - name: A menu keeps the pointer free
        run: python3 tools/test_menu_mouse_grab.py

      # The demo refused -game at startup and accepted "game mymod" at
      # runtime, and the main menu offered MODS regardless (GitHub #171).
      - name: Mods need the full game
        run: python3 tools/test_demo_mods_gate.py

      # ARE_WE_IRONWAIL_YET.md carries a summary table over rows kept further
      # down the same file, and the two drift every time somebody flips a row
      # by hand.  The file records this happening in 2026-08-20 and twice on
      # 2026-08-31; the parser was written the second time and committed the
      # third, "so the next edit cannot skip it".  It was skipped anyway --
      # two flips reached the rows and not the header -- because nothing ran
      # it.  Now something does.
      - name: Ironwail scorecard matches its own rows
        run: python3 tools/ironwail_scorecard.py --check

