name: Tester build

# Hands an arbitrary commit to an external tester as a downloadable, runnable
# build.  Restored from 87719ff2e (uhexen2-n3lb), which was reachable from no
# ref after its branch was deleted.
#
# The original keyed off `push: branches: [mathuzzz_mdl_fixes]`.  That branch
# is gone, so restoring the trigger verbatim would have produced a workflow
# that could never fire again.  The two triggers below replace it:
#
#   workflow_dispatch  the real use case -- a maintainer decides to hand
#                      someone a build.  The `ref` input is not redundant
#                      with GitHub's own "Use workflow from" branch picker:
#                      workflow_dispatch can only run a workflow *file* that
#                      exists on the selected ref, and the commits we most
#                      need to hand out (the khsa probe builds on the
#                      rescue/khsa-* branches) predate this file.  Dispatch
#                      from master and set `ref` to build those.
#
#   push tester/**     keeps the old "push a branch, get a build, send the
#                      link" loop that uhexen2-khsa and uhexen2-zroc were
#                      actually delivered through, but namespaced instead of
#                      tied to one person's branch name.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to build (blank = this workflow ref)'
        required: false
        type: string
  push:
    branches:
      - 'tester/**'

# Builds and uploads artifacts; writes nothing back to the repository.
# Matches security-scan.yml and ci.yml.  uhexen2-bvei.
permissions:
  contents: read

# Keyed on the ref actually being built, not github.ref.  Under
# workflow_dispatch github.ref is always the workflow's own branch, so the
# obvious key would make two dispatches for two different commits cancel each
# other -- and a tester build silently killed by the next one is precisely the
# failure this workflow exists to avoid.  Two pushes to the same tester/**
# branch do supersede, which is what you want there.  uhexen2-bvei.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Observed runtime is well under a minute to a few minutes; this is a
    # "something is stuck" threshold, not a target, and is sized to leave
    # room for a cold cache.  Without it the job inherits GitHub's 6-hour
    # default.  uhexen2-bvei.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # Blank falls back to the dispatch/push ref, which is checkout's
          # default anyway.  Shallow is fine: the version string comes from
          # engine/hexen2/quakedef.h (HW_BASE_VERSION), not from git describe.
          ref: ${{ inputs.ref }}

      # The tooling this workflow runs -- setup-nix and package-release.sh --
      # comes from the workflow's own commit, not from the ref under test.
      # Dispatching from master with `ref` set to an older commit is the main
      # use, and those commits predate both, so loading them from the root
      # checkout would fail on "No such file or directory".  When the inline
      # packaging lived here it travelled with the workflow file; this keeps
      # that property.  Second, so the root checkout's clean cannot delete it.
      # Untracked in the root tree, so the git flake never sees it, and
      # nothing below packages or uploads it.
      #
      # This does not make every old commit packageable.  The script asserts
      # the current layout -- hexenwail.exe, not glh2.exe -- exactly as the
      # inline copy did, so a ref older than 7cfa258b8 (#274) still fails at
      # that check.  What it guarantees is that a ref new enough to have that
      # layout never fails merely for predating the script.
      #
      # No credentials: nothing is ever pushed from .ci.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci
          persist-credentials: false

      - uses: ./.ci/.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Named packages, individually -- never a sweep over `packages`.
      # packages.demodata is lib.licenses.unfree with hydraPlatforms = [], and
      # must never reach hexenwail.cachix.org (uhexen2-118f, uhexen2-3vmk).
      # The flake's allowUnfreePredicate permits it by name for local use, so
      # a sweep here would build and push it without complaint.  .#release
      # pulls only linux-fhs, nixos and win64.
      - name: Build release bundle
        run: nix build .#release --print-build-logs

      # Same fix as ci.yml: this could not fail, because without pipefail the
      # pipeline reported head's status and `|| true` swallowed the rest.  It
      # matters more here than there -- the whole point of this workflow is
      # handing a tester something that runs, so shipping a binary that dies
      # on startup is the one outcome it exists to prevent.  -k 5 because the
      # engine ignores SIGTERM during shutdown.  uhexen2-bvei.
      - name: Smoke test
        run: |
          set -euo pipefail
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy \
            timeout -k 5 10 nix run .#nixos -- -help > smoke.log 2>&1
          head -20 smoke.log

      - name: Package artifacts
        # Passed as env rather than interpolated into the script body: a
        # ${{ }} expression is pasted in as literal text before bash sees it,
        # so a dispatch `ref` containing $(...) would otherwise execute inside
        # the unquoted heredoc below.
        env:
          REF_NAME: ${{ inputs.ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The checked-out ref, not github.sha: with a `ref` input those are
          # different commits, and the whole point of the artifact name is
          # that the tester can tell us what they actually ran.
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

          # Same script release.yml packages with, so the Windows tree is the
          # release zip's layout exactly, and a layout fix lands in both at
          # once -- uhexen2-biyi and the glh2 rename each had to be made twice.
          #
          # The Linux tree is NOT the release zip's layout.  The release zip
          # keeps linux-x86_64/ as a directory beside gamecode/, licenses/ and
          # BUILD_INFO.txt; --flat-linux puts linux-x86_64/'s contents (bin/,
          # lib/, share/) at the root instead, beside those three.  Same files,
          # one directory level shallower.  That is how this workflow has
          # always laid it out, kept as-is until the maintainer decides whether
          # to unify the two.
          bash .ci/scripts/package-release.sh --flat-linux result/release pkg

          # Nothing else in the bundle records which commit this is, and a
          # tester reporting against "the build you sent me" is how uhexen2-khsa
          # burned ~29 builds without a reproducible data point.
          COMMIT=$(git rev-parse HEAD)
          for d in pkg/linux pkg/windows; do
            cat > "$d/TESTING.txt" <<EOF
          Hexenwail test build
          Commit:  ${COMMIT}
          Ref:     ${REF_NAME}
          Run:     ${RUN_URL}

          This is a test build, not a release. Quote the commit above in any
          report so it can be tied back to a specific build.

          This build carries its own gamecode, the same as a release does, so
          it is not running your install's progs.dat. The engine prints a
          "Gamecode:" line naming the exact file whenever it loads one --
          quote that line too, and if a bug looks like game logic rather than
          rendering, say whether launching with -vanillaprogs changes it.

          If you are reporting a rendering problem, these are worth far more
          than a description:
            - a savegame parked where the problem is visible
            - a screenshot of it
            - your GPU model and driver version
            - qconsole.log from this folder

          On Windows a crash also writes hexenwail.RPT next to hexenwail.exe; send that too.
          EOF
          done

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexenwail-test-linux-${{ env.SHORT_SHA }}
          path: pkg/linux/
          # GitHub's maximum. uhexen2-zroc sat undelivered for two months;
          # a tester build expiring before anyone sends the link is the
          # failure mode this workflow exists to prevent, so don't leave it
          # to an implicit default someone can lower repo-wide.
          retention-days: 90

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexenwail-test-windows-${{ env.SHORT_SHA }}
          path: pkg/windows/
          retention-days: 90
