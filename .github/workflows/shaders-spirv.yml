name: Shaders SPIR-V

# CompileSpirv.cmake compiles every engine/shaders/ stage with both
# glslangValidator -V (Vulkan) and -G (OpenGL SPIR-V), which is the only
# thing that proves the layout.inc set and binding qualifiers are complete.
# Before #340 decision 6 shaders_spirv was opt-in and nothing in CI ran it,
# so a new shader could ship without its Vulkan bindings and nothing noticed
# (the five SSAO stages from #446).  USE_SDL_GPU builds now run it ahead of
# the client, which embeds the result (spirv_embed, EmbedSpirv.cmake); the dev
# shell configures with USE_SDL_GPU on, so the target below is that same step,
# and the embedded table is checked against the .spv near the end.
#
# The same job then runs shaders_cross: CrossCompileShaders.cmake feeds
# the Vulkan .spv to shadercross and demands DXIL, MSL and a reflection
# JSON per stage.  That is what proves the descriptor sets are the ones
# SDL_GPU expects per stage -- the composite fragment shader's compute
# numbering only failed there (#448).  The flake.nix shadercross pin is
# already in the paths below.
#
# Last, tools/test_sdlgpu_bindings.py reads the Vulkan .spv and checks
# that every resource sits at the set and dense binding SDL_GPU will bind
# it at.  Neither compiler checks that; it needs the .spv, so it runs here
# and not in lint.yml (#340).  Before it, tools/test_shader_variants.py
# checks that the staging dir holds exactly one copy per stage, OIT twin
# and engine/shaders/variants.txt variant; its source-only half, that the
# manifest covers every #define the C prepends, is in lint.yml (#340).
# tools/test_vk_flip_y.py then checks that every Vulkan vertex stage stores
# the negated gl_Position.y on every return path and no GL one does; its
# source half (each main ends in VK_FLIP_Y()) is in lint.yml (#340).
# The same script holds every graphics stage's read-only storage blocks to
# the zeroed stand-in the backend binds until P5 (RG_SSBO_STANDIN_BYTES in
# engine/h2shared/rg_internal.h, hence that path below; #340 P2a).
# tools/gen_program_reflection.py --check regenerates the per-blob resource
# counts SDL_GPU creates each stage with and fails if the checked-in
# engine/h2shared/gl_progid_refl.h is stale (#340 P1b).
#
# The paths are everything the gate reads: the shaders themselves
# (.glsl AND .inc -- layout.inc/ssao.inc are the risk), the three CMake
# scripts that expand, compile and cross-compile them, the CMakeLists
# target definitions, and the flake.nix pins the targets depend on.
# GitHub #449, part of #77 / #339, route recorded in #447.  #448 extends
# it with the cross-compile gate.
on:
  pull_request:
    paths:
      - 'engine/shaders/**'
      - 'engine/cmake/CompileSpirv.cmake'
      - 'engine/cmake/CrossCompileShaders.cmake'
      - 'engine/cmake/EmbedShaders.cmake'
      - 'engine/cmake/EmbedSpirv.cmake'
      - 'engine/h2shared/rg_spirv.h'
      - 'engine/CMakeLists.txt'
      - 'flake.nix'
      - '.github/workflows/shaders-spirv.yml'
      - 'tools/test_sdlgpu_bindings.py'
      - 'tools/test_shader_variants.py'
      - 'tools/test_vk_flip_y.py'
      - 'tools/gen_program_reflection.py'
      - 'tools/test_embed_spirv.py'
      - 'tools/test_rg_compute_reflect.py'
      - 'engine/h2shared/rg_shader.c'
      - 'engine/h2shared/gl_progid_refl.h'
      - 'engine/h2shared/rg_internal.h'
  push:
    branches: [master]
    paths:
      - 'engine/shaders/**'
      - 'engine/cmake/CompileSpirv.cmake'
      - 'engine/cmake/CrossCompileShaders.cmake'
      - 'engine/cmake/EmbedShaders.cmake'
      - 'engine/cmake/EmbedSpirv.cmake'
      - 'engine/h2shared/rg_spirv.h'
      - 'engine/CMakeLists.txt'
      - 'flake.nix'
      - '.github/workflows/shaders-spirv.yml'
      - 'tools/test_sdlgpu_bindings.py'
      - 'tools/test_shader_variants.py'
      - 'tools/test_vk_flip_y.py'
      - 'tools/gen_program_reflection.py'
      - 'tools/test_embed_spirv.py'
      - 'tools/test_rg_compute_reflect.py'
      - 'engine/h2shared/rg_shader.c'
      - 'engine/h2shared/gl_progid_refl.h'
      - 'engine/h2shared/rg_internal.h'

# Builds and throws the result away; nothing here writes to the repository.
permissions:
  contents: read

# A second push makes the first result describe a tree nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders-spirv:
    name: Compile shaders to SPIR-V and cross-compile to DXIL/MSL
    runs-on: ubuntu-latest
    # Seconds of glslang after nix setup and one engine configure.
    # A "something is stuck" bound, not a target.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Configure, then build only the shaders_spirv target.  It exists only
      # when CMake finds glslangValidator, so a dev shell that lost glslang
      # fails here with "no rule to make target" instead of passing
      # vacuously.  CompileSpirv.cmake runs BOTH frontends per stage and
      # exits non-zero if any single compile fails.
      - name: Build shaders_spirv
        run: |
          set -euo pipefail
          nix develop -c cmake -S . -B /tmp/shader-build
          nix develop -c cmake --build /tmp/shader-build --target shaders_spirv

      # Second target, same configure: shaders_cross depends on
      # shaders_spirv, so the .spv inputs exist by the time it runs.
      # CrossCompileShaders.cmake fails the build on any error, and a
      # missing target (shadercross absent from the dev shell) fails here
      # loudly instead of passing vacuously.  GitHub #448.
      - name: Build shaders_cross
        run: |
          set -euo pipefail
          nix develop -c cmake --build /tmp/shader-build --target shaders_cross

      # The .vk.spv are what SDL_GPU will be handed, and SDL_GPU binds by
      # position: within each descriptor set, sampled textures, then storage
      # textures, then storage buffers, numbered densely from 0.  glslang and
      # shadercross both accept a shader that breaks that (the four SSAO
      # compute stages had their samplers at set 0 bindings 8..), so check it
      # here, on the SPIR-V itself.  --sources fails any stage the gate did
      # not compile.  Stock python3; no tool from the dev shell.  #340.
      # EmbedShaders wrote one offline copy per engine/shaders/variants.txt
      # variant, so the gates above compiled every program the engine builds
      # at run time.  Check the staging dir holds exactly those copies, each
      # with its manifest #defines; the same run re-checks the manifest
      # against the C.  #340 (P-1b).
      - name: Check the offline shader variants
        run: |
          set -euo pipefail
          python3 tools/test_shader_variants.py --vk-dir /tmp/shader-build/engine/generated/vk -v

      - name: Check SDL_GPU binding layout
        run: |
          set -euo pipefail
          python3 tools/test_sdlgpu_bindings.py /tmp/shader-build/engine/generated/spirv \
            --sources /tmp/shader-build/engine/generated/vk -v

      # The backend's own reflection (rg_shader.c RG_CheckStage, lifted) on
      # the compute blobs this build made: every storage block at the slot
      # and GL point its source names (#340 P5c).  Needs cc only.
      - name: Check the backend's compute reflection
        run: |
          set -euo pipefail
          python3 tools/test_rg_compute_reflect.py --spirv-dir /tmp/shader-build/engine/generated/spirv \
            --vk-dir /tmp/shader-build/engine/generated/vk

      # SDL_CreateGPUShader / SDL_CreateGPUComputePipeline take each stage's
      # resource counts (and a compute stage's threadcount), which cannot be
      # asked of a blob at run time.  engine/h2shared/gl_progid_refl.h carries
      # them, one row per offline copy, generated from these .vk.spv by
      # tools/gen_program_reflection.py and checked in so the GLES and web
      # builds need no glslang (#340 decision 6).  Regenerate it and fail if the
      # checked-in copy differs, or if any row disagrees with shadercross's
      # own reflection JSON of the same blob (shaders_cross above); lint.yml's
      # test_program_routing.py checks its rows are the offline copies and
      # every program's blobs.  #340 (P1b).
      - name: Check the program reflection table
        run: |
          set -euo pipefail
          python3 tools/gen_program_reflection.py /tmp/shader-build/engine/generated/spirv --check \
            --cross /tmp/shader-build/engine/generated/cross

      # The USE_SDL_GPU client links generated/spirv_gen.c, which the
      # spirv_embed target writes from these .vk.spv (EmbedSpirv.cmake).  It
      # refuses a table whose rows are not the blobs, so it runs after the
      # reflection check above, whose message says how to fix that.  Then
      # every row must be embedded word for word.  #340 decision 6.
      - name: Check the embedded SPIR-V table
        run: |
          set -euo pipefail
          nix develop -c cmake --build /tmp/shader-build --target spirv_embed
          python3 tools/test_embed_spirv.py \
            --generated /tmp/shader-build/engine/generated/spirv_gen.c \
            --spirv-dir /tmp/shader-build/engine/generated/spirv

      # SDL_GPU is +Y up with row 0 at the top; GL puts NDC y = -1 on row 0.
      # Every vertex stage negates gl_Position.y in its Vulkan SPIR-V only
      # (layout.inc VK_FLIP_Y), so render targets keep GL's row order.  A
      # stage that forgets compiles cleanly and draws upside down under
      # SDL_GPU alone, so check the compiled blobs.  #340 (Y flip).
      - name: Check the SDL_GPU Y flip
        run: |
          set -euo pipefail
          python3 tools/test_vk_flip_y.py --spirv /tmp/shader-build/engine/generated/spirv \
            --sources /tmp/shader-build/engine/generated/vk
