name: Shaders SPIR-V

# CompileSpirv.cmake compiles every engine/shaders/ stage with both
# glslangValidator -V (Vulkan) and -G (OpenGL SPIR-V), which is the only
# thing that proves the layout.inc set and binding qualifiers are complete.
# But shaders_spirv is opt-in, not in ALL, and nothing in CI used to run
# it, so a new shader could ship without its Vulkan bindings and nothing
# noticed.  The five SSAO stages from #446 are the most recent example.
#
# The same job then runs shaders_cross: CrossCompileShaders.cmake feeds
# the Vulkan .spv to shadercross and demands DXIL, MSL and a reflection
# JSON per stage.  That is what proves the descriptor sets are the ones
# SDL_GPU expects per stage -- the composite fragment shader's compute
# numbering only failed there (#448).  The flake.nix shadercross pin is
# already in the paths below.
#
# The paths are everything the gate reads: the shaders themselves
# (.glsl AND .inc -- layout.inc/ssao.inc are the risk), the three CMake
# scripts that expand, compile and cross-compile them, the CMakeLists
# target definitions, and the flake.nix pins the targets depend on.
# GitHub #449, part of #77 / #339, route recorded in #447.  #448 extends
# it with the cross-compile gate.
on:
  pull_request:
    paths:
      - 'engine/shaders/**'
      - 'engine/cmake/CompileSpirv.cmake'
      - 'engine/cmake/CrossCompileShaders.cmake'
      - 'engine/cmake/EmbedShaders.cmake'
      - 'engine/CMakeLists.txt'
      - 'flake.nix'
      - '.github/workflows/shaders-spirv.yml'
  push:
    branches: [master]
    paths:
      - 'engine/shaders/**'
      - 'engine/cmake/CompileSpirv.cmake'
      - 'engine/cmake/CrossCompileShaders.cmake'
      - 'engine/cmake/EmbedShaders.cmake'
      - 'engine/CMakeLists.txt'
      - 'flake.nix'
      - '.github/workflows/shaders-spirv.yml'

# Builds and throws the result away; nothing here writes to the repository.
permissions:
  contents: read

# A second push makes the first result describe a tree nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders-spirv:
    name: Compile shaders to SPIR-V and cross-compile to DXIL/MSL
    runs-on: ubuntu-latest
    # Seconds of glslang after nix setup and one engine configure.
    # A "something is stuck" bound, not a target.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Configure, then build only the shaders_spirv target.  It exists only
      # when CMake finds glslangValidator, so a dev shell that lost glslang
      # fails here with "no rule to make target" instead of passing
      # vacuously.  CompileSpirv.cmake runs BOTH frontends per stage and
      # exits non-zero if any single compile fails.
      - name: Build shaders_spirv
        run: |
          set -euo pipefail
          nix develop -c cmake -S . -B /tmp/shader-build
          nix develop -c cmake --build /tmp/shader-build --target shaders_spirv

      # Second target, same configure: shaders_cross depends on
      # shaders_spirv, so the .spv inputs exist by the time it runs.
      # CrossCompileShaders.cmake fails the build on any error, and a
      # missing target (shadercross absent from the dev shell) fails here
      # loudly instead of passing vacuously.  GitHub #448.
      - name: Build shaders_cross
        run: |
          set -euo pipefail
          nix develop -c cmake --build /tmp/shader-build --target shaders_cross
