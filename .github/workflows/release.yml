name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9]-*'
      - '[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flatpak:
    runs-on: ubuntu-latest
    # flatpak-builder installed directly on the runner — see ci.yml for rationale.
    steps:
      - uses: actions/checkout@v6
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # appstream provides appstreamcli, used to validate the metainfo
          # after the release entry is injected below.
          sudo apt-get install -y flatpak flatpak-builder appstream
          # The container image came with Flathub pre-configured and ran as
          # root; a bare apt install on the runner has neither.  Add the
          # system remote, then pre-install the runtime + SDK as root (root
          # bypasses polkit, which the unprivileged runner user lacks for
          # system flatpak operations).  Without this the action's own
          # `flatpak --system install` fails with "operation Deploy not
          # allowed for user"; once the deps are present that install is a
          # no-op.
          #
          # --no-related skips the extensions flatpak would otherwise drag in
          # with the runtime — .Locale (both Platform and Sdk), .GL.default,
          # .codecs-extra — none of which a build needs.  Worth ~16s.  The
          # action's own --install-deps-from=flathub only installs the runtime
          # and sdk the manifest names, so it does not pull them back.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive --no-related flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      # The manifest installs the metainfo verbatim, so whatever <release> sits
      # at the top of it is the version GNOME Software and KDE Discover show.
      # Nothing used to update it, and it silently read "26.03-alpha" for five
      # months of releases.  Prepend an entry for the tag being built.
      #
      # HEAD is the tag commit (it is what triggered this run), so %cs works on
      # the shallow clone without fetching history.  Idempotent: re-running a
      # tag build will not duplicate the entry.
      - name: Record this release in the AppStream metainfo
        run: |
          META=flatpak/io.github.hexenwail.hexenwail.metainfo.xml
          VERSION="${{ github.ref_name }}"
          if grep -q "<release version=\"$VERSION\"" "$META"; then
            echo "metainfo already lists $VERSION"
          else
            DATE=$(git log -1 --format=%cs HEAD)
            python3 - "$META" "$VERSION" "$DATE" <<'PY'
          import sys
          path, version, date = sys.argv[1:4]
          entry = (
              f'    <release version="{version}" date="{date}">\n'
              f'      <url type="details">https://github.com/hexenwail/hexenwail/releases/tag/{version}</url>\n'
              f'    </release>\n'
          )
          s = open(path).read()
          if '  <releases>\n' not in s:
              sys.exit('no <releases> block in ' + path)
          open(path, 'w').write(s.replace('  <releases>\n', '  <releases>\n' + entry, 1))
          PY
            echo "added $VERSION ($DATE) to $META"
          fi
          appstreamcli validate --explain "$META" || {
            echo "::error::metainfo failed AppStream validation after injection"
            exit 1
          }

      # No cache-key — see the same block in ci.yml.  A key built from
      # ${{ github.sha }} can never be matched by the action's only restore
      # fallback (the prefix "flatpak-builder-<arch>"), so the dependency
      # modules were rebuilt on every single run.  Leaving it at the default
      # also makes tag builds share the cache CI already warmed on master.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hexenwail-${{ github.ref_name }}.flatpak
          manifest-path: flatpak/io.github.hexenwail.hexenwail.yml
          upload-artifact: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        # Cachix outages shouldn't fail the build — we just lose the cache.
        continue-on-error: true
        with:
          name: hexenwail
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build release binaries
        run: nix build .#release --print-build-logs

      - name: Package
        run: |
          cp -rL result/release staging

          # Linux: keep the linux-x86_64/ tree as-is.  gamecode/ is a shared
          # staging tree, not part of any platform dir, so it has to be named
          # here or it ships nowhere (uhexen2-8qp3).
          (cd staging && zip -r ../hexenwail-${{ github.ref_name }}-linux-x86_64.zip \
            linux-x86_64/ gamecode/ licenses/ BUILD_INFO.txt)

          # Windows: Hexen II-style flat layout — glh2.exe + DLLs at the zip
          # root next to an empty data1/, so users extract straight into their
          # Hexen II directory and drop pak0.pak/pak1.pak into data1/.
          winpkg=hexenwail-windows
          mkdir -p "$winpkg/data1"
          cp staging/windows-x86_64/bin/* "$winpkg/"
          # get_demo.* live beside bin/, not in it, so copying bin/* alone
          # shipped a bundle whose own BUILD_INFO.txt told users to run a
          # file that was not there.
          cp staging/windows-x86_64/get_demo.ps1 staging/windows-x86_64/get_demo.cmd "$winpkg/"
          # gamecode/ stays a subdirectory even in the flat Windows layout:
          # this zip is meant to be extracted straight into a Hexen II folder,
          # so putting progs.dat at data1/progs.dat here would overwrite the
          # player's retail gamecode on unzip, with no copy in any .pak to
          # restore from.  Keep the copy deliberate.
          cp -r staging/gamecode "$winpkg/"
          cp -r staging/licenses "$winpkg/"
          cp staging/BUILD_INFO.txt "$winpkg/"
          echo "Place your Hexen II pak files (pak0.pak, pak1.pak) in this folder." \
            > "$winpkg/data1/README - put pak files here.txt"
          (cd "$winpkg" && zip -r ../hexenwail-${{ github.ref_name }}-windows-x86_64.zip .)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: hexenwail-${{ github.ref_name }}-linux-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: hexenwail-${{ github.ref_name }}-windows-x86_64.zip

      - name: Generate changelog
        run: |
          # Pick the most recently CREATED tag, not the lex-highest version
          # name.  Three legacy tag schemes linger in this repo (uhexen2-*,
          # 26.03-*, v0.7.1-alpha.r3) and lex-sort above the current
          # 0.7.x-beta.rN scheme, so version:refname kept comparing every
          # release against v0.7.1-alpha.r3.
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="## What's changed since $PREV_TAG"
          else
            RANGE="HEAD"
            HEADER="## Initial release"
          fi
          {
            echo "$HEADER"
            echo ""
            echo "### Commits"
            echo ""
            git log "$RANGE" --no-merges --format="- %s (\`%h\`)" | grep -v "Sync beads" || true
            echo ""
            echo "## Downloads"
            echo ""
            echo "- **Linux x86_64** — extract and run \`glhexen2\` from your Hexen II data directory"
            echo "- **Linux Flatpak** — \`flatpak install hexenwail-*.flatpak\`, then place game data in \`~/.var/app/io.github.hexenwail.hexenwail/.hexen2/data1/\`"
            echo "- **Windows x86_64** — extract anywhere, drop \`pak0.pak\`/\`pak1.pak\` into the included \`data1/\` folder, run \`glh2.exe\`"
            echo ""
            echo "Requires game data files (\`data1/pak0.pak\`, \`data1/pak1.pak\`)."
            echo ""
            echo "### Optional: compiled gamecode"
            echo ""
            echo "Both zips now include a \`gamecode/\` folder — the Hexen II game logic rebuilt"
            echo "from source, carrying fixes that are not in Raven's 1997 \`progs.dat\` (chiefly"
            echo "dropped backpacks silently vanishing in co-op and deathmatch)."
            echo ""
            echo "**It is not installed for you.** The tree under \`gamecode/\` mirrors your Hexen II"
            echo "folder: copy \`gamecode/data1/progs.dat\` to \`data1/progs.dat\`, and so on. Install"
            echo "\`progs.dat\` and \`progs2.dat\` together, and add \`portals/progs.dat\` if you have the"
            echo "Portal of Praevus mission pack — with the mission pack active the \`data1\` copy is"
            echo "never read."
            echo ""
            echo "**Back up the files you replace.** Retail keeps \`progs.dat\` loose and no \`.pak\`"
            echo "contains a spare copy, so restoring your backup is the only way back."
            echo ""
            echo "Two things to know before you install it:"
            echo ""
            echo "- **\"Vanilla\" now means two different things.** A build running our gamecode will"
            echo "  behave differently from Raven's in ways that are not engine bugs. If you report"
            echo "  a problem, please say whether \`gamecode/\` is installed; removing it is the"
            echo "  fastest way to tell whose bug it is. This cuts both ways — some reports against"
            echo "  older releases will have been gamecode issues we had already fixed."
            echo "- **Portals: the Crusader's Glyph of the Ancients damages you too.** The glyph"
            echo "  detonates on whoever touches it for real damage — 50 in deathmatch, 37"
            echo "  otherwise — the caster included. Do not walk into your own glyph. This is"
            echo "  Raven's original behaviour, so nothing changes if you are coming from a stock"
            echo "  \`progs.dat\`; it is called out because Hexenwail's own gamecode briefly let the"
            echo "  glyph pass harmlessly through the caster, and that exemption is gone."
            echo ""
            echo "### Reporting a crash"
            echo ""
            echo "Windows builds report crashes by themselves — there is nothing to install or enable."
            echo "If the game dies, a file called \`glh2.RPT\` appears next to \`glh2.exe\`."
            echo "Attach that file and \`qconsole.log\` from the same folder to your report."
            echo ""
            echo "The Windows build ships with debug symbols, so that report names the source file"
            echo "and line the game died on — there is no separate debug download to fetch."
            echo ""
            echo "To verify a download, fetch \`SHA256SUMS\` alongside it and run \`sha256sum -c SHA256SUMS\`."
            echo ""
            echo "**Requirements:** OpenGL 4.3 capable GPU (2012+)"
          } > release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  publish:
    runs-on: ubuntu-latest
    needs: [flatpak, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # scripts/get_demo.sh verifies Raven's demo download against a known
      # SHA-256, but our own binaries shipped with nothing to check them
      # against.  Collect the three artifacts and publish digests alongside
      # them so a download can be verified:  sha256sum -c SHA256SUMS
      - name: Generate SHA256SUMS
        run: |
          mkdir -p dist
          cp linux-bundle/hexenwail-${{ github.ref_name }}-linux-x86_64.zip dist/
          cp windows-bundle/hexenwail-${{ github.ref_name }}-windows-x86_64.zip dist/
          cp hexenwail-${{ github.ref_name }}-x86_64.flatpak/hexenwail-${{ github.ref_name }}.flatpak dist/
          # Run in dist/ so the file records bare names, not paths — that is
          # what `sha256sum -c` expects next to the downloaded files.  The
          # patterns are explicit rather than `*` so the digest file can never
          # end up listing itself.
          (cd dist && sha256sum hexenwail-*.zip hexenwail-*.flatpak > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --prerelease \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes/release_notes.md \
            dist/hexenwail-${{ github.ref_name }}-linux-x86_64.zip \
            dist/hexenwail-${{ github.ref_name }}-windows-x86_64.zip \
            dist/hexenwail-${{ github.ref_name }}.flatpak \
            dist/SHA256SUMS
