name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9]-*'
      - '[0-9]*.[0-9]*.[0-9]*-*'

# Read by default.  Only `publish` creates the release, and it is the one job
# that touches nothing but already-built artifacts -- where flatpak and build
# run flatpak-builder and Nix fetches over the network while holding whatever
# token they were given.  Narrowed at the job level below.  uhexen2-bvei.
permissions:
  contents: read

# Deliberately no `concurrency` here, unlike the other three.  Cancelling a
# release mid-flight can leave a tag with some assets uploaded and no release
# body, or a published release missing a bundle -- strictly worse than paying
# for a duplicate run.  Tags are pushed one at a time anyway.  uhexen2-bvei.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Same gate ci.yml runs, called from here so it applies to the tag too.
  # ci.yml is `tags-ignore: **`, so shellcheck, the metainfo validation and
  # the bare-EMSCRIPTEN guard used to be skipped on the one build that
  # reaches users -- covered only by the convention that a tag sits on a
  # commit master already saw, which nothing enforced.  uhexen2-5zei.
  lint:
    uses: ./.github/workflows/lint.yml

  flatpak:
    runs-on: ubuntu-latest
    # Gated on lint so a red gate costs seconds, not a full flatpak-builder
    # run -- and, through publish's needs, cannot reach a published release.
    needs: [lint]
    # Observed runtime is well under a minute to a few minutes; this is a
    # "something is stuck" threshold, not a target, and is sized to leave
    # room for a cold cache.  Without it the job inherits GitHub's 6-hour
    # default.  uhexen2-bvei.
    timeout-minutes: 30
    # flatpak-builder installed directly on the runner — see ci.yml for rationale.
    steps:
      - uses: actions/checkout@v6
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # --no-install-recommends, with the tools flatpak-builder actually
          # shells out to named explicitly.  Plain `apt-get install
          # flatpak-builder` pulls 123 packages and 99 MB: appstream-compose
          # Recommends ffmpeg, which drags in the entire multimedia stack --
          # libavcodec, mesa-va-drivers, intel-media-va-driver, pocketsphinx,
          # openal, SDL2 -- none of which builds a Flatpak.  That apt step was
          # ~47s of a ~60-125s job, far more than flatpak-builder's own ~42s.
          #
          # The named set is what upstream flatpak-builder actually links or
          # invokes (appstream-compose for metainfo, desktop-file-utils to
          # validate the .desktop, elfutils for debuginfo, ostree for the repo,
          # bubblewrap for the build sandbox).  Fewer packages is also fewer
          # downloads to fail: on 2026-08-17 a GitHub incident took releases
          # down by failing a single tarball fetch, and 123 packages is 123
          # chances at that.  uhexen2-bvei.
          # `appstream` on top of that set: it provides appstreamcli, which the
          # metainfo validation step below needs.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder bubblewrap ostree \
            appstream-compose desktop-file-utils elfutils appstream
          # The container image came with Flathub pre-configured and ran as
          # root; a bare apt install on the runner has neither.  Add the
          # system remote, then pre-install the runtime + SDK as root (root
          # bypasses polkit, which the unprivileged runner user lacks for
          # system flatpak operations).  Without this the action's own
          # `flatpak --system install` fails with "operation Deploy not
          # allowed for user"; once the deps are present that install is a
          # no-op.
          #
          # --no-related skips the extensions flatpak would otherwise drag in
          # with the runtime — .Locale (both Platform and Sdk), .GL.default,
          # .codecs-extra — none of which a build needs.  Worth ~16s.  The
          # action's own --install-deps-from=flathub only installs the runtime
          # and sdk the manifest names, so it does not pull them back.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive --no-related flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      # The manifest installs the metainfo verbatim, so whatever <release> sits
      # at the top of it is the version GNOME Software and KDE Discover show.
      # Nothing used to update it, and it silently read "26.03-alpha" for five
      # months of releases.  Prepend an entry for the tag being built.
      #
      # HEAD is the tag commit (it is what triggered this run), so %cs works on
      # the shallow clone without fetching history.  Idempotent: re-running a
      # tag build will not duplicate the entry.
      - name: Record this release in the AppStream metainfo
        run: |
          META=flatpak/io.github.hexenwail.hexenwail.metainfo.xml
          VERSION="${{ github.ref_name }}"
          if grep -q "<release version=\"$VERSION\"" "$META"; then
            echo "metainfo already lists $VERSION"
          else
            DATE=$(git log -1 --format=%cs HEAD)
            python3 - "$META" "$VERSION" "$DATE" <<'PY'
          import sys
          path, version, date = sys.argv[1:4]
          entry = (
              f'    <release version="{version}" date="{date}">\n'
              f'      <url type="details">https://github.com/hexenwail/hexenwail/releases/tag/{version}</url>\n'
              f'    </release>\n'
          )
          s = open(path).read()
          if '  <releases>\n' not in s:
              sys.exit('no <releases> block in ' + path)
          open(path, 'w').write(s.replace('  <releases>\n', '  <releases>\n' + entry, 1))
          PY
            echo "added $VERSION ($DATE) to $META"
          fi
          # --no-net: without it, appstreamcli fetches every <url> in the file
          # and reports an unreachable one as a warning, which it exits non-zero
          # on -- so a release could fail for reasons that have nothing to do
          # with the tag being built.  0.8.0-beta.r5 died exactly that way while
          # r4 had passed the day before on the same workflow, the same
          # appstreamcli 1.0.2 and the same URLs: the bugtracker link resolves
          # or not depending on how github.com answers that minute.  We want
          # this step checking that the entry we just injected is well-formed,
          # not probing the internet.  uhexen2-vm9w.
          appstreamcli validate --no-net --explain "$META" || {
            echo "::error::metainfo failed AppStream validation after injection"
            exit 1
          }

      # No cache-key — see the same block in ci.yml.  A key built from
      # ${{ github.sha }} can never be matched by the action's only restore
      # fallback (the prefix "flatpak-builder-<arch>"), so the dependency
      # modules were rebuilt on every single run.  Leaving it at the default
      # also makes tag builds share the cache CI already warmed on master.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hexenwail-${{ github.ref_name }}.flatpak
          manifest-path: flatpak/io.github.hexenwail.hexenwail.yml
          upload-artifact: true

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        # Cachix outages shouldn't fail the build — we just lose the cache.
        continue-on-error: true
        with:
          name: hexenwail
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build release binaries
        run: nix build .#release --print-build-logs

      - name: Package
        run: |
          cp -rL result/release staging

          # Linux: keep the linux-x86_64/ tree as-is.  gamecode/ is a shared
          # staging tree, not part of any platform dir, so it has to be named
          # here or it ships nowhere (uhexen2-8qp3).
          (cd staging && zip -r ../hexenwail-${{ github.ref_name }}-linux-x86_64.zip \
            linux-x86_64/ gamecode/ licenses/ BUILD_INFO.txt)

          # Windows: Hexen II-style flat layout — glh2.exe + DLLs at the zip
          # root next to an empty data1/, so users extract straight into their
          # Hexen II directory and drop pak0.pak/pak1.pak into data1/.
          winpkg=hexenwail-windows
          mkdir -p "$winpkg/data1"
          cp staging/windows-x86_64/bin/* "$winpkg/"
          # get_demo.* live beside bin/, not in it, so copying bin/* alone
          # shipped a bundle whose own BUILD_INFO.txt told users to run a
          # file that was not there.
          cp staging/windows-x86_64/get_demo.ps1 staging/windows-x86_64/get_demo.cmd "$winpkg/"
          # gamecode/ stays a subdirectory even in the flat Windows layout:
          # this zip is meant to be extracted straight into a Hexen II folder,
          # so putting progs.dat at data1/progs.dat here would overwrite the
          # player's retail gamecode on unzip, with no copy in any .pak to
          # restore from.  Keep the copy deliberate.
          cp -r staging/gamecode "$winpkg/"
          cp -r staging/licenses "$winpkg/"
          cp staging/BUILD_INFO.txt "$winpkg/"
          echo "Place your Hexen II pak files (pak0.pak, pak1.pak) in this folder." \
            > "$winpkg/data1/README - put pak files here.txt"
          (cd "$winpkg" && zip -r ../hexenwail-${{ github.ref_name }}-windows-x86_64.zip .)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: hexenwail-${{ github.ref_name }}-linux-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: hexenwail-${{ github.ref_name }}-windows-x86_64.zip

      - name: Generate changelog
        run: |
          # A release may ship hand-written notes: put them at
          # docs/release-notes/<tag>.md and they replace the generated header
          # and commit dump.  Everything after that point is boilerplate and
          # is emitted either way.  Raw commit lists are a poor summary of a
          # rollup release, and PREV_TAG below is by design the *previous*
          # tag, which for a long-running branch may be days old while the
          # release spans months.
          #
          # docs/RELEASE_NOTES_STYLE.md is the template that curated file is
          # written to -- structure, voice, badge colors, and the standing rule
          # that a release body never lists raw commits or SHAs.  The fallback
          # below breaks that rule on purpose: an un-curated tag still needs a
          # body, and a commit dump that says so is better than an empty one.
          # It is a placeholder, not the format.  uhexen2-rf9y.
          CURATED="docs/release-notes/${{ github.ref_name }}.md"
          CURATED_BODY=""
          FULL_CHANGELOG=""
          if [ -f "$CURATED" ]; then
            # Held back and re-emitted at the very end of the assembled body,
            # where GitHub's own generated notes put it; left in place it
            # would land mid-document, ahead of Downloads.  Command
            # substitution also eats the trailing blank line it leaves.
            CURATED_BODY=$(sed '/^\*\*Full Changelog\*\*:/d' "$CURATED")
            FULL_CHANGELOG=$(sed -n '/^\*\*Full Changelog\*\*:/p' "$CURATED")
          fi

          # Pick the most recently CREATED tag, not the lex-highest version
          # name.  Three legacy tag schemes linger in this repo (uhexen2-*,
          # 26.03-*, v0.7.1-alpha.r3) and lex-sort above the current
          # 0.7.x-beta.rN scheme, so version:refname kept comparing every
          # release against v0.7.1-alpha.r3.
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="### Changes since [$PREV_TAG](https://github.com/hexenwail/hexenwail/releases/tag/$PREV_TAG)"
          else
            RANGE="HEAD"
            HEADER="### Initial release"
          fi
          TAG="${{ github.ref_name }}"
          {
            if [ -f "$CURATED" ]; then
              # printf, not echo: the notes are markdown full of backticks and
              # $ and must reach the release body uninterpreted.
              printf '%s\n' "$CURATED_BODY"
            else
              # No curated body for this tag.  Emit the download badges the
              # curated file would have carried, then say plainly that what
              # follows is a placeholder, so nobody mistakes a commit dump for
              # the house style.  See docs/RELEASE_NOTES_STYLE.md.
              # Static badges, not the github/downloads count endpoint: that
              # renders 0 for a tag nobody has downloaded yet, so the buttons
              # look broken in the first hours.  docs/RELEASE_NOTES_STYLE.md.
              echo "<a href=\"https://github.com/hexenwail/hexenwail/releases/download/$TAG/hexenwail-$TAG-windows-x86_64.zip\">![Download Windows build](https://img.shields.io/badge/%E2%AC%87_Windows_x86__64-blue?style=for-the-badge&logo=windows&logoColor=white)</a>"
              echo "<a href=\"https://github.com/hexenwail/hexenwail/releases/download/$TAG/hexenwail-$TAG-linux-x86_64.zip\">![Download Linux build](https://img.shields.io/badge/%E2%AC%87_Linux_x86__64-8A9A5B?style=for-the-badge)</a>"
              echo "<a href=\"https://github.com/hexenwail/hexenwail/releases/download/$TAG/hexenwail-$TAG.flatpak\">![Download Flatpak](https://img.shields.io/badge/%E2%AC%87_Flatpak-4A90D9?style=for-the-badge&logo=flatpak&logoColor=white)</a>"
              echo ""
              echo "$HEADER"
              echo ""
              echo "❗ **Note**: this tag shipped without hand-written notes, so the raw commit list stands in for them."
              echo ""
              git log "$RANGE" --no-merges --format="- %s (\`%h\`)" | grep -v "Sync beads" || true
            fi
            echo ""
            echo "### Downloads"
            echo ""
            echo "- **Linux x86_64** — extract and run \`glhexen2\` from your Hexen II data directory"
            echo "- **Linux Flatpak** — \`flatpak install hexenwail-*.flatpak\`, then place game data in \`~/.var/app/io.github.hexenwail.hexenwail/.hexen2/data1/\`"
            echo "- **Windows x86_64** — extract anywhere, drop \`pak0.pak\`/\`pak1.pak\` into the included \`data1/\` folder, run \`glh2.exe\`"
            echo ""
            echo "Requires game data files (\`data1/pak0.pak\`, \`data1/pak1.pak\`)."
            echo ""
            echo "### Compiled gamecode — included, and already in use"
            echo ""
            echo "Both zips carry the Hexen II game logic rebuilt from source, with fixes that are"
            echo "not in Raven's 1997 \`progs.dat\` (chiefly dropped backpacks silently vanishing in"
            echo "co-op and deathmatch)."
            echo ""
            echo "**There is nothing to install.** The engine ships its own copy beside the"
            echo "executable and prefers it to the one in your Hexen II folder — on Linux and on"
            echo "Windows alike, straight out of the zip. Nothing is copied and nothing of yours is"
            echo "overwritten."
            echo ""
            echo "- **To see which gamecode you are running**, look for the \`Gamecode:\` line the"
            echo "  engine prints when it loads one. It names the exact file and its checksum."
            echo "- **To turn it off**, launch with \`-vanillaprogs\`. The engine then ignores its own"
            echo "  copy and uses whatever your Hexen II install provides. Nothing is deleted, so it"
            echo "  is a per-launch decision."
            echo "- **To run different gamecode** — a translation, a balance patch, your own build —"
            echo "  put it in \`~/.hexen2/<gamedir>/\` on Linux, which outranks the bundled copy."
            echo "  Windows has no user directory, so replace the files in \`gamecode/\` beside"
            echo "  \`glh2.exe\` instead."
            echo ""
            echo "The \`gamecode/\` folder in the zip is those same three files. On Windows it *is*"
            echo "the copy the engine loads, since it sits next to \`glh2.exe\`; on Linux the engine"
            echo "loads its own from the platform directory and this one is a spare you can install"
            echo "by hand into a different engine. See \`gamecode/README.txt\`."
            echo ""
            echo "Two things to know:"
            echo ""
            echo "- **\"Vanilla\" now means two different things.** A build running our gamecode will"
            echo "  behave differently from Raven's in ways that are not engine bugs. If you report"
            echo "  a problem, please paste the \`Gamecode:\` line, or say whether \`-vanillaprogs\`"
            echo "  changes what you see — that is the fastest way to tell whose bug it is, and it"
            echo "  deletes nothing. This cuts both ways — some reports against older releases will"
            echo "  have been gamecode issues we had already fixed."
            echo "- **Portals: the Crusader's Glyph of the Ancients damages you too.** The glyph"
            echo "  detonates on whoever touches it for real damage — 50 in deathmatch, 37"
            echo "  otherwise — the caster included. Do not walk into your own glyph. This is"
            echo "  Raven's original behaviour, so nothing changes if you are coming from a stock"
            echo "  \`progs.dat\`; it is called out because Hexenwail's own gamecode briefly let the"
            echo "  glyph pass harmlessly through the caster, and that exemption is gone."
            echo ""
            echo "### Reporting a crash"
            echo ""
            echo "Windows builds report crashes by themselves — there is nothing to install or enable."
            echo "If the game dies, a file called \`glh2.RPT\` appears next to \`glh2.exe\`."
            echo "Attach that file and \`qconsole.log\` from the same folder to your report."
            echo ""
            echo "The Windows build ships with debug symbols, so that report names the source file"
            echo "and line the game died on — there is no separate debug download to fetch."
            echo ""
            echo "To verify a download, fetch \`SHA256SUMS\` alongside it and run \`sha256sum -c SHA256SUMS\`."
            echo ""
            echo "**Requirements:** OpenGL 4.3 capable GPU (2012+)"
            if [ -n "$FULL_CHANGELOG" ]; then
              echo ""
              printf '%s\n' "$FULL_CHANGELOG"
            fi
          } > release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [flatpak, build]
    # The only job that writes: `gh release create` below.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # scripts/get_demo.sh verifies Raven's demo download against a known
      # SHA-256, but our own binaries shipped with nothing to check them
      # against.  Collect the three artifacts and publish digests alongside
      # them so a download can be verified:  sha256sum -c SHA256SUMS
      - name: Generate SHA256SUMS
        run: |
          mkdir -p dist
          cp linux-bundle/hexenwail-${{ github.ref_name }}-linux-x86_64.zip dist/
          cp windows-bundle/hexenwail-${{ github.ref_name }}-windows-x86_64.zip dist/
          cp hexenwail-${{ github.ref_name }}-x86_64.flatpak/hexenwail-${{ github.ref_name }}.flatpak dist/
          # Run in dist/ so the file records bare names, not paths — that is
          # what `sha256sum -c` expects next to the downloaded files.  The
          # patterns are explicit rather than `*` so the digest file can never
          # end up listing itself.
          (cd dist && sha256sum hexenwail-*.zip hexenwail-*.flatpak > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --prerelease \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes/release_notes.md \
            dist/hexenwail-${{ github.ref_name }}-linux-x86_64.zip \
            dist/hexenwail-${{ github.ref_name }}-windows-x86_64.zip \
            dist/hexenwail-${{ github.ref_name }}.flatpak \
            dist/SHA256SUMS
