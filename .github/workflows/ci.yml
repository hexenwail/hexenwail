name: CI

on:
  push:
    branches: [master]
    tags-ignore:
      - '**'
  pull_request:
    branches: [master]

# Nothing here writes to the repository -- it builds, lints and throws the
# result away.  security-scan.yml has always scoped itself this way; these
# jobs simply never did, and inherited whatever the repository default is.
# uhexen2-bvei.
permissions:
  contents: read

# A second push while the first is still going makes the first result
# worthless -- it describes a tree nobody has any more -- and this workflow
# builds seven targets, so paying for it twice is the expensive kind of
# worthless.  uhexen2-bvei.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Observed runtime is well under a minute to a few minutes; this is a
    # "something is stuck" threshold, not a target, and is sized to leave
    # room for a cold cache.  Without it the job inherits GitHub's 6-hour
    # default.  uhexen2-bvei.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck and appstream
        run: |
          # The flatpak job below updates before installing; this one did not,
          # so it worked only for as long as the runner image's index stayed
          # fresh enough to still resolve these versions.  uhexen2-bvei.
          sudo apt-get update
          sudo apt-get install -y shellcheck appstream

      - name: Shellcheck
        run: shellcheck scripts/mkrelease.sh flatpak/hexenwail.sh

      # The metainfo is what GNOME Software and KDE Discover read, and Flathub
      # rejects a submission whose metainfo does not validate.  Nothing checked
      # it before, so breakage would only have surfaced at publish time.
      # Note this validates structure, not currency — release.yml is what keeps
      # the <releases> block from going stale.
      #
      # --no-net for the same reason release.yml carries it (327bd5510):
      # appstreamcli otherwise fetches every <url> in the file and treats an
      # unreachable one as a warning it exits non-zero on, so this step went
      # red when github.com had a bad minute rather than when the file was
      # wrong.  That is what failed release r5.  Structure is what we want
      # checked here.  uhexen2-vm9w, uhexen2-bvei.
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net --explain flatpak/io.github.hexenwail.hexenwail.metainfo.xml

      # emscripten.h defines a bare EMSCRIPTEN alias under a deprecation
      # pragma, so a guard spelled that way only works in translation units
      # that happen to include the header — it fails silently rather than
      # loudly, and would compile the desktop branch on WASM.  uhexen2-uf5s.
      # The if(EMSCRIPTEN) uses in engine/CMakeLists.txt are CMake variables,
      # not C macros, so this is deliberately scoped to C sources.
      - name: No bare EMSCRIPTEN guards in C sources
        run: |
          if grep -rnE '(^|[^_A-Za-z])EMSCRIPTEN([^_A-Za-z]|$)' \
               --include='*.c' --include='*.h' engine/; then
            echo "::error::use __EMSCRIPTEN__, not the deprecated bare EMSCRIPTEN"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        # Cachix outages (e.g. 502 from cachix.org) shouldn't fail the build —
        # we just lose the cache for that run.
        continue-on-error: true
        with:
          name: hexenwail
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Linux
        run: nix build .#nixos --print-build-logs

      # This is the only step in the pipeline that runs the engine rather than
      # compiling it, and until now it could not fail: with no pipefail the
      # pipeline reported head's status, and `|| true` swallowed whatever
      # survived that.  A binary that segfaulted on startup passed.
      #
      # -k 5 because the engine ignores SIGTERM during shutdown, so a plain
      # `timeout` can wait forever on a wedged process -- which, with no
      # timeout-minutes on the job, is a six-hour run.
      #
      # -help is safe to assert on: sys_unix.c handles it with PrintHelp()
      # then exit(0), before any SDL or video init.  uhexen2-bvei.
      - name: Smoke test
        run: |
          set -euo pipefail
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy \
            timeout -k 5 10 nix run .#nixos -- -help > smoke.log 2>&1
          head -20 smoke.log

      - name: Build dedicated server
        run: nix build .#h2ded --print-build-logs

      - name: Build Windows
        run: nix build .#win64 --print-build-logs

      # Cheap on the back of the step above — same mingw toolchain closure,
      # and the server links no SDL, GL or codecs.  Without it the WIN32
      # branch of the h2ded target and engine/hexen2/server/sys_win.c can
      # break silently, exactly the rot uhexen2-hx78 described for Unix.
      # uhexen2-befz.
      - name: Build Windows dedicated server
        run: nix build .#h2ded-win64 --print-build-logs

      # BUILD_UTILS defaults OFF, so without these the three CMakeLists that
      # build the map/model toolchain are gated by nothing.  Plain C, no SDL,
      # GL or codecs — cheap on both hosts.  uhexen2-bjgb, uhexen2-4xd7.
      - name: Build tools
        run: nix build .#utils --print-build-logs

      - name: Build Windows tools
        run: nix build .#utils-win64 --print-build-logs

      # Runs hcc over all four HexenC trees.  Until this existed nothing in
      # the build read gamecode/ at all, so a .hc edit that did not even
      # compile would land green — and did not have to be exotic to do it:
      # a fix normally goes into h2, hw and portals together.  Nearly free
      # on the back of .#utils above (same closure, hcc is the only input,
      # a couple of seconds per tree).
      #
      # This gates compilation only.  It is deliberately NOT wired into
      # .#release: whether Hexenwail ships a progs.dat is a separate and
      # still-open question, see docs/GAMECODE.md.  uhexen2-zmb3.
      - name: Build gamecode
        run: nix build .#gamecode --print-build-logs

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # flatpak + flatpak-builder are installed directly on the runner — the
    # bilelmoussaoui/flatpak-github-actions container image worked until
    # Docker Hub flaked (release run 27069188929, 2026-06-06) and tanked
    # the whole release because the container couldn't be pulled.  Ubuntu
    # 24.04 ships flatpak-builder in main, so no PPA is needed.  The 25.08
    # runtime/SDK is still pulled from Flathub either way.
    steps:
      - uses: actions/checkout@v6
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # --no-install-recommends, with the tools flatpak-builder actually
          # shells out to named explicitly.  Plain `apt-get install
          # flatpak-builder` pulls 123 packages and 99 MB: appstream-compose
          # Recommends ffmpeg, which drags in the entire multimedia stack --
          # libavcodec, mesa-va-drivers, intel-media-va-driver, pocketsphinx,
          # openal, SDL2 -- none of which builds a Flatpak.  That apt step was
          # ~47s of a ~60-125s job, far more than flatpak-builder's own ~42s.
          #
          # The named set is what upstream flatpak-builder actually links or
          # invokes (appstream-compose for metainfo, desktop-file-utils to
          # validate the .desktop, elfutils for debuginfo, ostree for the repo,
          # bubblewrap for the build sandbox).  Fewer packages is also fewer
          # downloads to fail: on 2026-08-17 a GitHub incident took releases
          # down by failing a single tarball fetch, and 123 packages is 123
          # chances at that.  uhexen2-bvei.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder bubblewrap ostree \
            appstream-compose desktop-file-utils elfutils
          # The container image came with Flathub pre-configured and ran as
          # root; a bare apt install on the runner has neither.  Add the
          # system remote, then pre-install the runtime + SDK as root (root
          # bypasses polkit, which the unprivileged runner user lacks for
          # system flatpak operations).  Without this the action's own
          # `flatpak --system install` fails with "operation Deploy not
          # allowed for user"; once the deps are present that install is a
          # no-op.
          #
          # --no-related skips the extensions flatpak would otherwise drag in
          # with the runtime — .Locale (both Platform and Sdk), .GL.default,
          # .codecs-extra — none of which a build needs.  Worth ~16s.  The
          # action's own --install-deps-from=flathub only installs the runtime
          # and sdk the manifest names, so it does not pull them back.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive --no-related flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      # No cache-key: the action's default is
      # flatpak-builder-<arch>-<sha256(manifest)[:20]>, and its only restore
      # fallback is the prefix "flatpak-builder-<arch>".  A key containing
      # ${{ github.sha }} sorts as flatpak-builder-<sha>-x86_64, which that
      # prefix can never match, so every run logged "No cache was found" and
      # rebuilt fluidsynth/ogg/vorbis/opus/opusfile/libxmp from scratch (~87s)
      # before uploading a 69 MiB cache nobody would read.  With the default,
      # an unchanged manifest is an exact hit (which also skips the save), and
      # a changed manifest still warm-restores via the prefix and rebuilds
      # only from the edited module onward.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hexenwail.flatpak
          manifest-path: flatpak/io.github.hexenwail.hexenwail.yml
