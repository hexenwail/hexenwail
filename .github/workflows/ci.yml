name: CI

on:
  push:
    branches: [master]
    tags-ignore:
      - '**'
  pull_request:
    branches: [master]

env:
  # Pinned, never "latest".  Must match pages.yml: the PR check is only worth
  # running if it uses the toolchain the deploy will use.
  EMSDK_VERSION: '4.0.23'

# Nothing here writes to the repository -- it builds, lints and throws the
# result away.  security-scan.yml has always scoped itself this way; these
# jobs simply never did, and inherited whatever the repository default is.
# uhexen2-bvei.
permissions:
  contents: read

# A second push while the first is still going makes the first result
# worthless -- it describes a tree nobody has any more -- and this workflow
# builds seven targets, so paying for it twice is the expensive kind of
# worthless.  uhexen2-bvei.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Extracted to a reusable workflow so release.yml runs the same gate.
  # This workflow carries `tags-ignore: **`, so before uhexen2-5zei the tag
  # build -- the one that reaches users -- ran no lint at all.
  lint:
    uses: ./.github/workflows/lint.yml

  # The browser build has its own compiler, its own GL tier (USE_GLES) and its
  # own set of things that are compile-time no-op macros rather than function
  # pointers, so none of the seven native targets below can catch a regression
  # in it.  Until this existed the only thing that built WASM was pages.yml,
  # which runs on push to master -- i.e. the web client broke after merge, on
  # the deploy, with nothing red on the PR that did it.
  #
  # Same composite action pages.yml uses, so this is the deploy's build minus
  # the upload.
  #
  # Pull requests only.  On push to master pages.yml runs this identical build
  # and validation, wasm boot smoke included, so running it here too spent
  # ~95s per merge on a duplicate.  pages.yml is the master-push gate: a
  # break that reaches master turns that workflow red instead of this one.
  # As a required status check this job is unaffected -- required checks are
  # evaluated on pull requests, where it always runs.
  pwa:
    name: PWA / WebAssembly
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Cold, this is an emsdk install plus a full engine compile; warm it is
    # the compile alone.  A "something is stuck" bound, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebAssembly client + assemble PWA artifact
        uses: ./.github/actions/wasm-build
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}
          dist-dir: dist

      # Assembled and checked, never uploaded -- publishing is pages.yml's job
      # and this workflow has no pages: write to do it with.
      - name: Validate assembled PWA artifact
        run: ./scripts/wasm-validate-artifact.sh dist

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Test multiplayer transparency state
        run: nix develop -c python3 tools/test_multiplayer_transparency.py

      - name: Test brush and liquid alpha policy
        run: nix develop -c python3 tools/test_brush_alpha.py

      - name: Test HexenWorld local presentation state
        run: nix develop -c python3 tools/test_hw_viewmodel_feedback.py

      - name: Test texture LOD bias capability gate
        run: nix develop -c python3 tools/test_lod_bias_gate.py

      - name: Test GL model loader invariants
        run: nix develop -c python3 tools/test_gl_model_loaders.py

      - name: Build Linux
        run: nix build .#nixos --print-build-logs

      # This is the only step in the pipeline that runs the engine rather than
      # compiling it, and until now it could not fail: with no pipefail the
      # pipeline reported head's status, and `|| true` swallowed whatever
      # survived that.  A binary that segfaulted on startup passed.
      #
      # -k 5 because the engine ignores SIGTERM during shutdown, so a plain
      # `timeout` can wait forever on a wedged process -- which, with no
      # timeout-minutes on the job, is a six-hour run.
      #
      # -help is safe to assert on: sys_unix.c handles it with PrintHelp()
      # then exit(0), before any SDL or video init.  uhexen2-bvei.
      - name: Smoke test
        run: |
          set -euo pipefail
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy \
            timeout -k 5 10 nix run .#nixos -- -help > smoke.log 2>&1
          head -20 smoke.log

      # Build both server variants explicitly: h2ded does not compile the
      # HexenWorld sources or the shared code with H2W defined.
      - name: Build dedicated servers
        run: |
          set -euo pipefail
          for target in h2ded hwsv; do
            echo "::group::Build .$target"
            nix build ".#$target" --print-build-logs
            echo "::endgroup::"
          done

      # Compiling hwsv does not prove it can reach main().  This runs it with
      # no game data and asserts it dies at the FS_Init gate with a diagnostic
      # -- exit code exactly 1, which is Sys_Error's exit(1), so a segfault
      # (139) or a wedge that -k 5 has to kill (124) fails the step instead of
      # passing as "nonzero".
      #
      # NOTE what this does NOT cover.  #35 asks for a smoke on the HexenWorld
      # pak gate, Sys_Error("You must have the HexenWorld data installed") in
      # engine/h2shared/quakefs.c.  That gate is unreachable here: FS_Init
      # demands a valid Hexen II installation first, and a runner has no game
      # data at all, so hwsv dies on the earlier data1/pak0.pak check and never
      # looks for hw/pak4.pak.  Reaching the HexenWorld gate needs real data1
      # present with hw/pak4.pak absent, and data1 is licensed content that
      # cannot go in CI.  A green check here means hwsv starts and fails
      # cleanly; it says nothing about HexenWorld data handling.
      #
      # -k 5 for the same reason as the Smoke test step above: the engine
      # ignores SIGTERM during shutdown.
      - name: Smoke test HexenWorld dedicated server
        run: |
          set -euo pipefail
          status=0
          timeout -k 5 30 nix run .#hwsv > hwsv-smoke.log 2>&1 || status=$?
          head -20 hwsv-smoke.log
          if [ "$status" -ne 1 ]; then
            echo "hwsv exited $status; expected 1 from Sys_Error"
            exit 1
          fi
          if ! grep -q 'FATAL ERROR: Unable to find a proper Hexen II installation' hwsv-smoke.log; then
            echo "hwsv exited 1, but not at the FS_Init data1 gate -- see the log above."
            echo "Sys_Error exits 1 for every fatal, so the exit code alone proves nothing."
            exit 1
          fi

      # The PWA job builds with emsdk + rustup, so nothing else touches the
      # nix route to the web client: `nix develop .#wasm`, whose Rust comes
      # from rust-overlay at the version engine/rust/rust-toolchain.toml pins.
      # Evaluating it is cheap and fails if the pin names a release the locked
      # rust-overlay does not know -- the drift check-rust.sh cannot see,
      # because it only compares the pin against nixpkgs' rustc.
      - name: Evaluate the wasm dev shell
        run: nix eval --raw .#devShells.x86_64-linux.wasm.drvPath

      # The one part of the HexenWorld client that CI can test properly: the
      # signon download parser and packed projectile handling need no game data,
      # display or network.
      - name: Unit test HexenWorld download parsing
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -o hw_download_test scripts/hw_download_test.c
          ./hw_download_test

      # Deterministic, data-free gates for the HexenWorld client:
      # temp-entity payload layouts (#213) against the gamecode writers and
      # a byte-stream unit test, and the compiled-in string tables (#214)
      # against gamecode/res.
      - name: HexenWorld temp-entity layouts and string tables
        run: |
          set -euo pipefail
          nix develop --command python3 scripts/hw_tent_layout_check.py
          nix develop --command cc -Wall -Wextra -Werror \
            -o hw_tent_test scripts/hw_tent_test.c -lm
          ./hw_tent_test
          nix develop --command python3 scripts/gen_hw_strings.py --check

      # Same duty for the CE_* effect messages (#213): svc_start_effect,
      # svc_update_effect, svc_turn_effect and svc_multieffect.  These are
      # written by engine code rather than gamecode, so the layout check
      # derives its sizes from SV_SendEffect, PF_updateeffect, PF_turneffect
      # and SV_ParseMultiEffect.
      - name: HexenWorld effect payload layouts
        run: |
          set -euo pipefail
          nix develop --command python3 scripts/hw_ce_layout_check.py
          nix develop --command cc -Wall -Wextra -Werror \
            -o hw_ce_test scripts/hw_ce_test.c
          ./hw_ce_test

      # Structural gate on the GL buffer binding cache (#203).  Caching the
      # generic (non-indexed) binding point is what produced both
      # "glBufferSubData(offset 0 + size 1024 > buffer size 288)" and
      # "glBufferSubData(no buffer bound)": ~40 raw glBindBuffer_fp calls
      # elsewhere in the engine bypass any such cache and make it lie.
      - name: GL buffer binding cache gate
        run: |
          set -euo pipefail
          nix develop --command python3 scripts/gl_binding_cache_check.py

      - name: Unit test HexenWorld packed projectiles
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -o hw_projectile_test scripts/hw_projectile_test.c
          ./hw_projectile_test

      # The HexenWorld client clock (#308): cl.time must advance without
      # svc_time, mtime must follow entity updates, and entities must be
      # drawn interpolated in [0, 1] rather than frozen or extrapolated.
      - name: Unit test HexenWorld client clock
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -o hw_clock_test scripts/hw_clock_test.c -lm
          ./hw_clock_test

      - name: Unit test brush render state
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -Iengine/h2shared -Icommon -o brush_render_state_test \
            engine/tests/brush_render_state_test.c
          ./brush_render_state_test

      - name: Unit test host tick planning
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -Iengine/h2shared -o host_tick_test \
            engine/tests/host_tick_test.c
          ./host_tick_test

      - name: Unit test menu pointer geometry
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -Iengine/h2shared -o menu_pointer_test \
            engine/tests/menu_pointer_test.c
          ./menu_pointer_test

      - name: Unit test vid_restart context lifetime
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -Iengine/h2shared -o vid_restart_context_test \
            engine/tests/vid_restart_context_test.c
          ./vid_restart_context_test

      - name: Unit test SV_CheckBottom corner box
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -o sv_checkbottom_test \
            engine/tests/sv_checkbottom_test.c
          ./sv_checkbottom_test

      - name: Unit test hexenwail version cvar
        run: |
          set -euo pipefail
          nix develop --command cc -Wall -Wextra -Werror \
            -o version_cvar_test \
            engine/tests/version_cvar_test.c
          ./version_cvar_test

  # The Rust gate and the Windows/tools/gamecode loop share nothing with the
  # steps in `build` -- check-rust.sh builds its own tree under mktemp and
  # every target in the loop is its own derivation; neither reads ./result --
  # so each is a job of its own.  Serial, `build` was the critical path at
  # 295-344s, ~130s of it this gate and ~75-90s that loop.
  rust:
    name: Rust ports
    runs-on: ubuntu-latest
    # One shared cmake build of three engine targets plus every harness.  A
    # "something is stuck" bound, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # engine/rust is linked into every engine target on every platform; there
      # is no C fallback to build.  What the nix builds in `build` cannot show
      # is that each port still computes what its C original computed, so this
      # runs every differential harness against that C, the per-port symbol
      # and stray-object checks, the Rust/C struct layouts, the toolchain pin
      # and the rejection of the removed -DUSE_*_RS=OFF switches -- on one
      # shared engine build.  (Before the archive was mandatory this was eleven
      # steps that each built the engine twice, once per flag setting:
      # twenty-two builds of one tree.)  Per-port notes -- msg_io's three-way
      # H2/H2W/Rust comparison, info_str's hwsv-only shape, huffman's two
      # allocation strategies and guard-page decode -- live in the header of
      # each scripts/check-rust-<port>.sh.
      - name: Rust ports (differential harnesses, symbols, ABI)
        run: nix develop .#default -c bash ./scripts/check-rust.sh

  # The Hexen II transport is Rust on every Unix now, not only Linux.  What
  # the Linux gate above cannot show is that the port still computes the C's
  # bytes where the address layout differs: under HAVE_SA_LEN -- macOS and the
  # BSDs -- sockaddr_in carries an sa_len byte, so the family sits at offset 1
  # and is one byte wide, and the ioctl request numbers and the errno values
  # compared against are different numbers again.
  #
  # Only the differential fixture runs here, not scripts/check-rust.sh.  The
  # engine does not build on macOS yet -- glhexen2 is behind ANGLE
  # (uhexen2-6wj4, and docs/COMPILE still lists Linux and Windows) -- and the
  # fixture does not need it: it links the Rust archive against the C originals
  # compiled by the same host compiler, which is the comparison that decides
  # whether the port is portable.
  macos-transport:
    name: macOS transport fixture
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # rustup ships on the runner, but not the version engine/rust/
      # rust-toolchain.toml pins.  Installing it is not ceremony: the fixture
      # compares this compiler's Rust against this host's C, and the pin is
      # what every other target in this workflow uses.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' engine/rust/rust-toolchain.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version
      # macOS has no /usr/bin/timeout; the harness prefers one when it is there
      # and runs unbounded when it is not.  Worth having, since a fixture that
      # deadlocks on a socket read would otherwise sit until the job's own
      # limit.  Homebrew calls it gtimeout, and skips the install when present.
      - name: Ensure a watchdog for the harness
        run: command -v timeout >/dev/null || command -v gtimeout >/dev/null || brew install coreutils
      - name: Hexen II transport differential fixture
        run: bash scripts/check-rust-net-h2-fixture.sh

  # The same fixture on a real BSD, which is the half of "non-Linux Unix"
  # darwin only stands in for.  FreeBSD reaches errno through __error() and
  # h_errno by yet another route, and gives FIONBIO/FIONREAD their own
  # encodings, so it exercises net_udp_h2_target.c rather than agreeing with
  # macOS about the numbers.
  freebsd-transport:
    name: FreeBSD transport fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Hexen II transport differential fixture
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # libglvnd is not for the driver -- it is for the harness.  net_defs.h
            # reaches glheader.h through quakedef.h, so GL/gl.h has to exist to
            # compile the C originals the fixture compares against, even though
            # nothing here touches the renderer.
            pkg install -y bash rust libglvnd
          run: |
            bash scripts/check-rust-net-h2-fixture.sh

  cross:
    name: Windows, tools and gamecode
    runs-on: ubuntu-latest
    # Five nix builds, mostly Cachix hits.  A "something is stuck" bound, not
    # a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Keep the cross-compiled, tools and gamecode targets in one grouped
      # step.  The loop preserves the explicit target list while avoiding a
      # separate workflow step for every small derivation.
      - name: Build Windows, tools and gamecode
        run: |
          set -euo pipefail
          for target in win64 h2ded-win64 utils utils-win64 gamecode; do
            echo "::group::Build .$target"
            nix build ".#$target" --print-build-logs
            echo "::endgroup::"
          done

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # apt install, then the Flathub runtime, SDK and rust-stable, restored
      # from the Actions cache when an entry exists.  release.yml's flatpak
      # job uses the same action.  The reasons behind each part are in
      # .github/actions/setup-flatpak/action.yml.
      - uses: ./.github/actions/setup-flatpak
      # No cache-key: the action's default is
      # flatpak-builder-<arch>-<sha256(manifest)[:20]>, and its only restore
      # fallback is the prefix "flatpak-builder-<arch>".  A key containing
      # ${{ github.sha }} sorts as flatpak-builder-<sha>-x86_64, which that
      # prefix can never match, so every run logged "No cache was found" and
      # rebuilt fluidsynth/ogg/vorbis/opus/opusfile/libxmp from scratch (~87s)
      # before uploading a 69 MiB cache nobody would read.  With the default,
      # an unchanged manifest is an exact hit (which also skips the save), and
      # a changed manifest still warm-restores via the prefix and rebuilds
      # only from the edited module onward.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hexenwail.flatpak
          manifest-path: flatpak/io.github.hexenwail.hexenwail.yml
