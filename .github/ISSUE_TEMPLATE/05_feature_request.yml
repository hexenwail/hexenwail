name: Feature request
description: Suggest a new feature, a rendering improvement, or a quality-of-life change.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Hexenwail's guiding rule is **Ironwail parity**: where [Ironwail](https://github.com/andrei-drexler/ironwail)
        has already solved a rendering or QoL problem for Quake, we prefer its approach for Hexen II rather than
        inventing a new one. If your idea exists in Ironwail (or QuakeSpasm, FTE, vkQuake), saying so and naming
        the cvar there makes it far more likely to get built.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the annoyance or limitation first, not the implementation. What are you unable to do today?
      placeholder: |
        On a 4K display the HUD is tiny, and the existing scale options jump from too small to too large.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behaviour you want. If it needs a cvar or a menu entry, suggest a name.
      placeholder: |
        A fractional HUD scale slider (e.g. scr_sbarscale accepting 1.5) exposed in Options → Display.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      multiple: true
      options:
        - Renderer / lighting / effects
        - HUD, menus, UI
        - Input, gamepad, controls
        - Audio / music
        - Mod support and compatibility
        - Multiplayer / HexenWorld
        - Packaging and distribution
        - Performance
        - Other
    validations:
      required: true

  - type: input
    id: prior-art
    attributes:
      label: Prior art
      description: An engine that already does this, and what it is called there. Leave blank if there is none.
      placeholder: "Ironwail: r_scale / scr_sbarscale; vkQuake does the same"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mockups, links to a mod that needs it, or how you would expect it to interact with existing options.
