<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hexenwail WebGL2 smoke test</title>
</head>
<body data-result="pending">
  <pre id="result">pending</pre>
  <script type="module">
    import { runWebGLDiagnostics } from '../lib/webgl-diagnostics.js';

    const output = document.getElementById('result');
    try {
      const report = runWebGLDiagnostics();
      // Stricter than the PWA launcher on purpose.  runWebGLDiagnostics only
      // throws for structural failures, because a real user's driver rounding a
      // pixel differently should not lock them out of the game.  CI runs a
      // pinned software rasterizer, so here a moved pixel is a regression.
      if (report.warnings.length > 0) {
        document.body.dataset.result = 'fail';
        output.textContent = report.warnings.join('\n');
      } else {
        document.body.dataset.result = 'pass';
        output.textContent = JSON.stringify(report);
      }
    } catch (error) {
      document.body.dataset.result = 'fail';
      output.textContent = error.stack || error.message;
    }
  </script>
</body>
</html>
