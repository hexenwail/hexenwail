[package]
name = "engine-rs"
version = "0.1.0"
edition = "2021"
# &raw mut (msg_io.rs) needs 1.82.  Stated so an older distro rustc reports
# the version instead of a syntax error.
rust-version = "1.82"
license = "GPL-3.0-or-later"
description = "Consolidated Rust FFI ports for the Hexenwail engine"
publish = false

[lib]
name = "engine_rs"
crate-type = ["staticlib"]

[features]
default = []
hashindex = []
mathlib = []
sizebuf = []
crc = []
link_ops = []
msg_io = []
info_str = []
strlcpy = []
strlcat = []
huffman = []
wad = []

[profile.release]
# Unwinding across an FFI boundary is undefined behaviour. Fatal paths go
# through the engine's noreturn C callbacks, so abort rather than unwind.
panic = "abort"
