[package]
name = "engine-rs"
version = "0.1.0"
edition = "2021"
# &raw mut (msg_io.rs) needs 1.82.  Stated so an older distro rustc reports
# the version instead of a syntax error.
rust-version = "1.82"
license = "GPL-3.0-or-later"
description = "Target-specific Rust FFI ports for the Hexenwail engine"
publish = false

[lib]
name = "engine_rs"
crate-type = ["staticlib"]

[features]
default = []
hashindex = []
mathlib = []
sizebuf = []
crc = []
link_ops = []
msg_io = []
info_str = []
strlcpy = []
strlcat = []
huffman = []
wad = []
cvar = []
cmd = []
quakefs = []
net_udp_hw = []
net_chan = []
net_loop_h2 = []
net_bsd_h2 = []
net_udp_h2 = []
h2ded_target = []
zone = []
# SV_HullPointContents and SV_RecursiveHullCheck (#455).  world_trace_hw is
# hwsv's: the same port, reporting a bad node through SV_Error, which only
# hwsv defines, instead of Sys_Error.
world_trace = []
world_trace_hw = ["world_trace"]
# SV_InitBoxHull and SV_HullForEntity (#455's second world.c slice).  Its own
# feature because it reads the target's layouts through
# engine/rust/world_target.c, which a harness for the traces alone does not
# link; world_trace_hw selects its HexenWorld arms too.
world_hull = ["world_trace"]
# SV_ClearWorld, SV_LinkEdict, SV_UnlinkEdict and the touch and leaf walks
# (#455's third world.c slice), through the same target shim.
world_link = ["world_hull", "link_ops", "mathlib"]
# SV_Move and the rest of world.c (#455's fourth and last world.c slice).
world_move = ["world_link"]
# sv_move.c's monster movement (#455's sv_move.c slice).  The diagnostics
# (sv_debugmovestep) stay C in sv_move.c and are called from here.
sv_move = ["world_move"]
# sv_phys.c's base helpers (#455's first sv_phys.c slice): SV_CheckVelocity,
# SV_RunThink, SV_Impact, ClipVelocity, SV_FlyMove, SV_FlyExtras,
# SV_AddGravity, SV_PushEntity.  Reads engine/rust/phys_target.c besides
# world_target.c.
sv_phys = ["world_move"]

[profile.release]
# Unwinding across an FFI boundary is undefined behaviour. Fatal paths go
# through the engine's noreturn C callbacks, so abort rather than unwind.
panic = "abort"
